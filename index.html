    { id: "ligne-verte", title: "La Ligne verte", original: "The Green Mile", year: 1996, cover: { bg: "#211f1b", fg: "#ebe5d6", motif: "corridor" }, from: "simetierre",
      why: "Le surnaturel au cœur d'une histoire profondément humaine.",
      pitch: "1932, dans le couloir de la mort d'un pénitencier du Sud. Le gardien-chef Paul Edgecombe voit arriver John Coffey, un colosse condamné pour le meurtre de deux fillettes. Le roman est d'abord paru en six épisodes." },
    { id: "22-11-63", title: "22/11/63", original: "11/22/63", year: 2011, cover: { bg: "#6e2b27", fg: "#f1e6d6", motif: "watch" }, from: "shining",
      why: "Un autre professeur d'anglais au centre du récit, et un détour par Derry, la ville de Ça.",
      pitch: "Jake Epping, professeur d'anglais dans le Maine, découvre au fond d'un snack un passage vers 1958. Le patron, Al, lui confie une mission : empêcher l'assassinat de John F. Kennedy." },
    { id: "nuit-noire", title: "Nuit noire, étoiles mortes", original: "Full Dark, No Stars", year: 2010, cover: { bg: "#0f1114", fg: "#d9dce0", motif: "stars" }, from: "misery",
      why: "Une noirceur toute humaine, sans monstre ni fantôme.",
      pitch: "Quatre longs récits très sombres : un fermier qui décide de se débarrasser de sa femme, une romancière agressée sur une route déserte, un homme malade à qui l'on propose un marché, une épouse qui découvre un secret dans son garage." },
    { id: "cujo", title: "Cujo", original: "Cujo", year: 1981, cover: { bg: "#b5843a", fg: "#1c140a", motif: "paw" }, from: "misery",
      why: "Un autre huis clos sous tension, dans une voiture en panne en plein soleil.",

  const recById = Object.fromEntries(RECS.map(r => [r.id, r]));

  const local = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

  /* ---------- Reading state ----------
     One entry per book: { status, startedAt, finishedAt, last }.
     The artifact's db ("shelf/<bookId>") is the source of truth and follows the owner

  const STATUSES = [
    { key: "en-cours", label: "En cours", pile: "En cours", empty: "Aucun livre en cours. Ouvrez un livre et choisissez « En cours »." },
    { key: "a-lire", label: "À lire", pile: "À lire", empty: "Plus rien en attente dans la bibliothèque." },

  ];
  let shelf = {};
  try { shelf = JSON.parse(local.get("csp.shelf") || "{}") || {}; } catch (e) { shelf = {}; }
  const entry = id => shelf[id] || {};
  const statusOf = id => entry(id).status || "a-lire";
  let db = null;
  let mode = "local"; // "local": this device only · "sync": owner, saved to db · "readonly": someone else's shelf · "cloud": the site, signed in
  const queues = {};
  let view = { refresh() {} };
  const refresh = () => view.refresh();

  function save(id, patch) {
    if (mode === "readonly" && "status" in patch) return;
    const next = { ...entry(id), ...patch };
    for (const k of Object.keys(next)) if (next[k] === null || next[k] === undefined) delete next[k];
    shelf = { ...shelf, [id]: next };
    local.set("csp.shelf", JSON.stringify(shelf));
    refresh();
    if (mode === "cloud" || signedInBefore()) return cloudQueue(id);
    if (mode !== "sync") return;
    queues[id] = (queues[id] || Promise.resolve())
      .then(() => db.doc("shelf/" + id).set({ ...shelf[id] }))
      .catch(e => {
        if (e && ["invalid_argument", "revoked", "not_granted", "capability_disabled"].includes(e.code)) { mode = "readonly"; refresh(); }
      });
  }

  function removeEntry(id) {
    if (mode === "readonly") return;
    const next = { ...shelf };
    delete next[id];
    shelf = next;
    local.set("csp.shelf", JSON.stringify(shelf));
    refresh();
    if (mode === "cloud" || signedInBefore()) return cloudQueue(id);
    if (mode !== "sync") return;
    queues[id] = (queues[id] || Promise.resolve())
      .then(() => db.doc("shelf/" + id).delete())
      .catch(() => {});
  }

  function setStatus(id, key) {
    if (entry(id).status === key) return;

    else if (key === "en-cours") save(id, { status: key, startedAt: today, finishedAt: null });
    else save(id, { status: key, finishedAt: today });
  }

  const fmtDate = iso => {
    const [y, m, d] = String(iso).split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }).replace(/^1 /, "1er ");
  };

  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return;
    let store = null;
    try { store = await c.use("db"); } catch (e) { store = null; }
    if (!store) return;

    try { const u = await c.use("user"); owner = u ? await u.isOwner() : false; } catch (e) { owner = false; }

    db.collection("shelf").onSnapshot(snap => {

  /* ---------- The site's shelf (Supabase) ----------

  const cloud = { client: null, user: null, ready: false };
  let pending = new Set();
  try { pending = new Set(JSON.parse(local.get("csp.pending") || "[]")); } catch (e) {}
  const keepPending = () => local.set("csp.pending", JSON.stringify([...pending]));
  // Signed in on this device, but Supabase could not be reached at load: changes still wait in the queue.
  const signedInBefore = () => mode === "local" && !!SB && !!local.get("sb-" + new URL(SB.url).hostname.split(".")[0] + "-auth-token");

  // Sends every queued book, one at a time; a book that fails stays queued for the next try.
  function cloudFlush() {
    flushing = flushing.then(async () => {
      if (mode !== "cloud") return;
      for (const id of [...pending]) {
        const t = cloud.client.from("shelf");
        const { error } = shelf[id]
          ? await t.upsert({ user_id: cloud.user.id, book_id: id, data: shelf[id], updated_at: new Date().toISOString() })

        if (error) return;
        pending.delete(id);
        keepPending();
      }
    }).catch(() => {});
    return flushing;
  }

  // Takes the stored shelf, except books this device changed and has not sent yet.
  async function cloudPull() {
    if (mode !== "cloud") return;
    await cloudFlush();
    const { data, error } = await cloud.client.from("shelf").select("book_id, data");
    if (error || mode !== "cloud") return;
    if (!data.length && Object.keys(shelf).length && !local.get("csp.cloud-seeded")) {
      // A first sign-in with an empty account: this device's shelf becomes the account's.
      local.set("csp.cloud-seeded", "1");
      Object.keys(shelf).forEach(id => pending.add(id));
      keepPending();
      return cloudFlush();
    }
    local.set("csp.cloud-seeded", "1");
    const next = {};
    data.forEach(r => { if (byId[r.book_id] || recById[r.book_id]) next[r.book_id] = { ...r.data }; });
    pending.forEach(id => { if (shelf[id]) next[id] = shelf[id]; else delete next[id]; });
    shelf = next;
    local.set("csp.shelf", JSON.stringify(shelf));
    refresh();

  let pullTimer = 0;
  const pullSoon = () => { clearTimeout(pullTimer); pullTimer = setTimeout(cloudPull, 300); };

  function cloudSession(session) {
    const user = session ? session.user : null;
    if ((user && user.id) === (cloud.user && cloud.user.id)) return;
    cloud.user = user;
    if (user) {
      mode = "cloud";
      pullSoon();
      cloud.client.channel("shelf").on("postgres_changes", { event: "*", schema: "public", table: "shelf" }, pullSoon).subscribe();

  (async () => {
    if (!SB || (window.claude && typeof window.claude.use === "function")) return;
    try {

    } catch (e) {
      return; // Supabase out of reach (offline, paused): the shelf stays on this device for now.

    cloud.ready = true;
    cloud.client.auth.onAuthStateChange((event, session) => setTimeout(() => cloudSession(session)));
    window.addEventListener("online", pullSoon);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullSoon(); });
    refresh();
  })();

  // The slip under the home page's colophon: sign in, or say the shelf is synced.
  function syncSlip() {
    if (!cloud.ready) return null;
    if (cloud.user) {
      return h("div", { class: "sync sync-on" },
        h("p", { class: "sync-title" }, "Carnet synchronisé"),
        h("p", null, "Vos lectures suivent ", h("b", null, cloud.user.email), " sur l'ordinateur comme sur le téléphone. ",
          h("button", { class: "link-btn", type: "button", onclick: () => cloud.client.auth.signOut() }, "Se déconnecter"))
      );
    }
    const email = h("input", { type: "email", name: "email", autocomplete: "username", placeholder: "Adresse e-mail", required: true, "aria-label": "Adresse e-mail" });
    const pass = h("input", { type: "password", name: "password", autocomplete: "current-password", placeholder: "Mot de passe", required: true, minlength: "8", "aria-label": "Mot de passe" });
    const msg = h("p", { class: "sync-msg", role: "status" });
    const say = t => { msg.textContent = fr(t); };
    const run = async create => {
      if (!email.reportValidity() || !pass.reportValidity()) return;
      say(create ? "Création du compte…" : "Connexion…");
      const auth = cloud.client.auth;
      const creds = { email: email.value.trim(), password: pass.value };
      const { data, error } = create ? await auth.signUp(creds) : await auth.signInWithPassword(creds);
      if (error) return say(/invalid login/i.test(error.message) ? "Adresse ou mot de passe incorrect."
        : /not confirmed/i.test(error.message) ? "Confirmez d'abord votre adresse avec le lien reçu par e-mail."
        : /signups? not allowed|disabled/i.test(error.message) ? "La création de compte est fermée sur ce site."
        : "Impossible pour l'instant : " + error.message);
      if (create && !data.session) say("Un e-mail de confirmation vient de partir : ouvrez le lien, puis revenez vous connecter ici.");
    };
    return h("div", { class: "sync" },
      h("p", { class: "sync-title" }, "Synchroniser ce carnet"),
      h("p", null, "Connectez-vous pour retrouver vos lectures sur tous vos appareils."),
      h("form", { onsubmit: e => { e.preventDefault(); run(false); } },
        email, pass,
        h("div", { class: "sync-actions" },
          h("button", { class: "btn btn-accent", type: "submit" }, "Se connecter"),
          h("button", { class: "btn", type: "button", onclick: () => run(true) }, "Créer mon compte")
        ),
        msg
      )
    );
  }

  // French typography: thin no-break space before ; : ! ? » and after «, curly apostrophes.
  const fr = s => String(s)
    .replace(/'/g, "’")
    .replace(/ ([;:!?»])/g, " $1")
    .replace(/« /g, "« ");

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = fr(v);
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(fr(kid)));
    }
    return el;
  }

  function spruceRow(seed, count, low, high, H, gap) {
    const r = seeded(seed);
    let d = `M0 ${H}V${f1(H - low * .16)}H1600V${H}Z`;
    for (let i = 0; i < count; i++) {
      const x = (i + .15 + r() * .7) * 1600 / count, h = low + r() * (high - low), half = h * (.12 + r() * .04);
      const tiers = 5 + Math.round(h / 20), step = h * .9 / tiers, right = [], left = [];
      for (let k = 1; k <= tiers; k++) {
        const y = H - h + step * k, grow = .22 + .78 * k / tiers;
        const outR = half * grow * (.85 + r() * .3), outL = half * grow * (.85 + r() * .3);
        if (k > 1) { right.push([x + outR * .42, y - step * .55]); left.push([x - outL * .42, y - step * .55]); }
        right.push([x + outR, y]);
        left.push([x - outL, y]);

      const pts = [[x, H - h], ...right, [x + 1.6, H], [x - 1.6, H], ...left.reverse()];
      if (gap && x > gap[0] && x < gap[1]) continue;

  /* ---------- Cover motifs ---------- */

  const motifs = {

    markers: () => `<svg viewBox="0 0 200 200" aria-hidden="true"><g transform="rotate(-5 100 58)"><rect x="34" y="42" width="132" height="30" fill="none" stroke="#c9b089" stroke-width="1.3"/><text x="100" y="62" text-anchor="middle" font-family="Courier Prime, Courier New, monospace" font-size="12.5" letter-spacing="1.6" fill="#c9b089">PET SEMATARY</text></g><path d="M-10 178 Q100 162 210 180" stroke="currentColor" stroke-width="1" fill="none" opacity=".5"/><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".9"><path d="M38 175 L43 128 M30 141 L53 144"/><path d="M80 170 L77 110 M64 125 L91 122"/><path d="M121 169 L125 136 M113 147 L136 150"/><path d="M160 174 L155 121 M144 135 L168 131"/></g></svg>`,

    /* Covers for the suggested books, ready for when their summaries are written */
    balloon: () => `<svg viewBox="0 0 200 200" aria-hidden="true"><path d="M100 136 C92 152 108 164 100 180 C94 192 104 200 100 212" stroke="currentColor" stroke-width="1" fill="none" opacity=".7"/><path d="M100 128 C78 128 64 106 64 84 C64 60 80 42 100 42 C120 42 136 60 136 84 C136 106 122 128 100 128 Z" fill="#c8453b"/><path d="M95 127 L105 127 L100 136 Z" fill="#c8453b"/><ellipse cx="85" cy="68" rx="7" ry="13" fill="#ffffff" opacity=".22" transform="rotate(-24 85 68)"/></svg>`,

    corn: () => `<svg viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round"><g stroke-width="2.2"><path d="M64 198 C66 150 60 104 66 58"/><path d="M100 198 C98 142 104 92 100 36"/><path d="M138 198 C136 152 142 108 136 64"/></g><g stroke-width="1.5" opacity=".85"><path d="M65 160 C52 150 42 152 32 164"/><path d="M63 118 C76 104 86 104 94 112"/><path d="M65 84 C54 74 46 74 38 82"/><path d="M99 168 C114 156 126 158 134 168"/><path d="M101 130 C86 118 76 118 70 126"/><path d="M101 76 C114 64 124 64 132 72"/><path d="M137 170 C150 160 160 162 170 174"/><path d="M139 126 C152 114 162 116 168 124"/><path d="M137 92 C128 82 120 82 112 90"/></g><g stroke-width="1" opacity=".7"><path d="M66 58 L60 46 M66 58 L66 44 M66 58 L72 47"/><path d="M100 36 L94 24 M100 36 L100 22 M100 36 L106 25"/><path d="M136 64 L130 52 M136 64 L136 50 M136 64 L142 53"/></g></g><ellipse cx="111" cy="100" rx="6.5" ry="17" fill="#d9b24a" transform="rotate(20 111 100)"/><path d="M103 116 C106 104 108 94 116 84" stroke="currentColor" stroke-width="1.2" fill="none" opacity=".7"/></svg>`,
    wheel: () => {
      const cx = 100, cy = 106, R = 56, pt = (a, r) => `${(cx + r * Math.cos(a * Math.PI / 180)).toFixed(1)} ${(cy + r * Math.sin(a * Math.PI / 180)).toFixed(1)}`;

  /* A book's page takes on its cover's colours: [glow at the top of the page, accent for its
     details]. Keyed by motif like the drawings above, so a new motif needs an entry here too. */
  const AMBIENCE = {
    drop: ["#4a1219", "#d8574b"],
    room217: ["#1b3a2b", "#d1b067"],
    road: ["#3b3524", "#ddb84f"],
    fog: ["#46545b", "#e4ebed"],
    markers: ["#40301f", "#d0b78f"],
    keys: ["#2f383d", "#d24d42"],
    balloon: ["#1f2c33", "#d8574b"],
    flame: ["#3b1c0f", "#e8894a"],
    screen: ["#1f2a30", "#e05a4c"],
    dome: ["#22353b", "#a9d4dc"],
    cuffs: ["#2e2b28", "#cfc8bb"],
    sparrows: ["#1e1e26", "#d9d4c8"],
    house: ["#2e2318", "#e0b552"],
    moon: ["#1a2138", "#e8dcb0"],
    crow: ["#36302a", "#d0584a"],
    seasons: ["#2a2a20", "#e3b54f"],
    dots: ["#163038", "#7fd0dc"],
    corn: ["#2c3220", "#d9b24a"],
    wheel: ["#2f1f33", "#e0b65a"],
    corridor: ["#1d3322", "#8cc07a"],
    watch: ["#3e1916", "#e2c27a"],
    stars: ["#1a1d24", "#c9cfd8"],
    paw: ["#3d2c14", "#e0a64e"]
  };
  function setView(name, book) {
    const style = document.body.style;
    const colours = book && AMBIENCE[book.cover.motif];
    document.body.dataset.view = name;
    if (colours) {
      style.setProperty("--book-glow", colours[0]);
      style.setProperty("--book-accent", colours[1]);
    } else {
      style.removeProperty("--book-glow");
      style.removeProperty("--book-accent");
    }
  }

  function cover(book) {
    const c = h("div", {
      class: "cover",

          h("span", { class: "pile-count" }, p.list.length ? `${p.list.length} livre${p.list.length > 1 ? "s" : ""}` : "")
        ),
        p.list.length
          ? pileList(p)
          : h("p", { class: "pile-empty" }, p.empty)
      )),
      recsSection(),
      // The dock at the foot of the page, its lantern alight, holding the colophon
      h("footer", { class: "pontoon" },
        h("p", { class: "colophon" }, "Les résumés suivent le découpage des éditions originales. Le statut de chaque livre se règle depuis sa page. Un nouveau livre à ajouter ? Il suffit de le demander à Claude."),
        syncSlip(),
        h("div", { class: "dock", "aria-hidden": "true", html: DOCK },
          h("div", { class: "dock-shine", html: dockShine(4) + dockShine(11) }),
          h("div", { class: "dock-front", html: `<svg viewBox="0 0 980 300">${lilyPads()}${STUMP}<path d="M695 201Q676 197 668 146" fill="none" stroke="#a8916a" stroke-opacity=".7" stroke-width="1.1"/>${FAR_REEDS}${halloween() ? PUMPKIN_BODIES : ""}</svg>` }),
          halloween() ? h("div", { class: "dock-pumpkins", html: PUMPKIN_GLOW }) : null,
          h("div", { class: "dock-boat", html: BOAT("csp-dock-boat-wave") }),
          h("div", { class: "dock-canoe", html: CANOE }),
          statusOf("carrie") === "lu" ? h("div", { class: "dock-carrie", "data-card": "carrie", html: CARRIE }) : null,
          statusOf("simetierre") === "lu" ? h("div", { class: "dock-relic dock-church", "data-card": "simetierre", html: CHURCH }) : null,
          statusOf("misery") === "lu" ? h("div", { class: "dock-relic dock-royal", "data-card": "misery", html: ROYAL }) : null,
          h("span", { class: "lantern-glow" }), h("span", { class: "lantern-flame" }),
          h("span", { class: "moths" }, MOTHS.map(([m, t, w]) => h("i", { style: `--m:${m};--t:${t}s;--w:-${w}s` }))),
          SEASON === "summer" ? h("span", { class: "dock-flies" }, DOCK_FLIES.map(([x, y, t, w]) => h("i", { style: `left:${x}%;top:${y}%;--t:${t}s;--w:-${w}s` }))) : null,
          h("div", { class: "dock-reedbed" }, reedClumps()),
          statusOf("shining") === "lu" ? h("div", { class: "dock-relic dock-lion", "data-card": "shining", style: `--shift:${LION_SPOT}%`, html: LION }) : null)
      )
    ));
  }

  function renderBook(book) {
    document.title = `${book.title} · Chapitres en suspens`;
    setView("book", book);
    const items = allItems(book);
    const nodes = [];
    const storedLast = () => lastOf(book, items);
    let lastIndex = storedLast();

    const resumeBox = h("div", { class: "resume" });
    function paintResume() {
      resumeBox.replaceChildren();
      resumeBox.hidden = lastIndex === null;
      if (lastIndex === null) return;
      resumeBox.append(...[
        h("span", null, "Marque-page : " + progressLabel(book, items[lastIndex])),
        h("button", { class: "link-btn", type: "button", onclick: () => goTo(lastIndex) }, "Y retourner"),
        canAsk() && lastIndex > 0
          ? h("button", { class: "link-btn", type: "button", onclick: () => { const i = lastIndex; goTo(i); runHelp(i, "express"); } }, "Résumé express jusque-là")
          : null,
        canAsk()
          ? h("button", { class: "link-btn", type: "button", onclick: () => { const i = lastIndex; goTo(i); runHelp(i, "cast"); } }, "Qui est qui à ce stade")
          : null
      ].filter(Boolean));
    }

    const linksBox = h("ul", { class: "links" });
    function paintLinks() {
      linksBox.replaceChildren(...(book.links || []).map(l => {
        if (l.gate && statusOf(l.gate) !== "lu") {
          return h("li", { class: "locked" }, `Un autre lien dévoile la fin de ${byId[l.gate].title} : il apparaîtra quand vous aurez marqué ce livre comme lu.`);
        }
        return h("li", null, l.t, l.to && byId[l.to] ? h("a", { href: "#" + l.to }, `Voir ${byId[l.to].title} →`) : null);
      }));
    }

    const statusBox = h("div", { class: "status-box" });
    function paintStatus() {
      const e = entry(book.id);
      const current = statusOf(book.id);
      const dates = [
        e.startedAt ? "Commencé le " + fmtDate(e.startedAt) : null,
        e.finishedAt ? "Terminé le " + fmtDate(e.finishedAt) : null
      ].filter(Boolean).join(" · ");
      const control = mode === "readonly"
        ? h("span", { class: "status-read" }, "Statut : " + STATUSES.find(s => s.key === current).label)
        : h("div", { class: "status", role: "radiogroup", "aria-label": "Statut de lecture" },
            ["a-lire", "en-cours", "lu"].map(key => h("button", {
              type: "button", role: "radio", "aria-checked": String(key === current),
              onclick: () => setStatus(book.id, key)
            }, STATUSES.find(s => s.key === key).label))
          );
      // replaceChildren/append would print a null as the text "null": leave it out instead.
      statusBox.replaceChildren(...[control, dates ? h("span", { class: "status-dates" }, dates) : null].filter(Boolean));
    }

    function setOpen(i, open) {
      const n = nodes[i];
      const was = n.li.classList.contains("open");
      n.li.classList.toggle("open", open);
      n.btn.setAttribute("aria-expanded", String(open));
      n.body.hidden = !open;
      n.action.textContent = open ? "Masquer" : "Afficher";
      if (open !== was) unseal(n, open);
    }
    // Everything before the bookmark counts as read.
    function paintFlags() {
      let stamps = 0;
      nodes.forEach((n, j) => {
        const passed = lastIndex !== null && j < lastIndex;
        n.li.classList.toggle("next", j === (lastIndex === null ? 0 : lastIndex + 1));
        n.flag.hidden = j !== lastIndex;
        if (passed && n.seen.hidden && !calm()) stamp(n.seen, stamps++);
        n.seen.hidden = !passed;
        n.mark.hidden = !passed;
        n.li.classList.toggle("passed", passed);
        n.btn.setAttribute("aria-label", items[j].d.full + (passed ? " · lu" : ""));
      });
    }
    // Opening a fiche moves the bookmark forward, never back: rereading an earlier one leaves it
    // where it was. Moving it back is asked for from that fiche ("Placer mon marque-page ici").
    function markLast(i) {
      if (lastIndex === null || i > lastIndex) setLast(i);
    }
    function setLast(i) {
      lastIndex = i;
      paintFlags();
      paintResume();
      const e = entry(book.id);
      if (e.last !== i || e.at !== items[i].n) save(book.id, { last: i, at: items[i].n });
    }
    function goTo(i) {
      setOpen(i, true);
      markLast(i);
      nodes[i].li.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      nodes[i].btn.focus({ preventScroll: true });
    }
    // "Aller à" brings a fiche into view still sealed, its row lit a moment: choosing one in the
    // list never shows its summary nor moves the bookmark.
    function seek(i) {
      const n = nodes[i];
      n.li.scrollIntoView({ behavior: calm() ? "auto" : "smooth", block: "start" });
      n.btn.focus({ preventScroll: true });
      n.li.classList.remove("sought");
      void n.li.offsetWidth;
      n.li.classList.add("sought");
      clearTimeout(n.soughtDone);
      n.soughtDone = setTimeout(() => n.li.classList.remove("sought"), 1000);
    }

    /* Two helps written by Claude from the summaries the reader has reached, and nothing past them:
       an express recap of the story so far, and who is who at that point. */
    const HELPS = {
      express: {
        head: target => "Résumé express · jusqu'à " + target,
        waiting: "Claude relit vos résumés…",
        cut: "Le résumé a été coupé avant la fin.",
        task: `Écris un « Précédemment dans ${book.title} » en français : un seul paragraphe de 5 à 7 phrases, au présent, qui rappelle l'essentiel de l'histoire jusqu'à ce point : la situation, les personnages importants et où ils en sont, les tensions encore en suspens. Insiste sur ce qui aide à reprendre la lecture.`,
        format: "- Pas de titre, pas de liste, pas de mise en forme : seulement le paragraphe."
      },
      cast: {
        head: target => "Qui est qui · " + target,
        waiting: "Claude fait le point sur les personnages…",
        cut: "La liste a été coupée avant la fin.",
        task: "Dresse la liste des personnages qui comptent à ce stade de sa lecture, du plus important au moins important, 8 au maximum. Pour chacun, dis en une phrase courte qui il est et où il en est à ce point de l'histoire.",
        format: "- Ne cite aucun personnage qui n'apparaît pas encore dans les résumés lus.\n- Une ligne par personnage, sous la forme « Nom | phrase ». Rien d'autre : pas de titre, pas d'introduction, pas de puces."
      }
    };
    function paintExpressButtons() {
      nodes.forEach((n, j) => {
        n.expressBtn.hidden = !canAsk() || j < 1;
        n.castBtn.hidden = !canAsk();
      });
    }
    // "Nom | phrase" lines become a list of names; anything else is left out.
    function castList(text) {
      const rows = String(text).split("\n")
        .map(line => line.replace(/\*\*/g, "").replace(/^\s*[-•*]\s*/, "").split("|"))
        .filter(parts => parts.length >= 2 && parts[0].trim());
      return rows.length
        ? h("dl", { class: "express-cast" }, rows.map(([name, ...rest]) => [h("dt", null, name.trim()), h("dd", null, rest.join("|").trim())]))
        : null;
    }
    let running = null;
    async function runHelp(i, kind) {
      if (!canAsk()) return;
      if (running) running.abort();
      const ctl = new AbortController();
      running = ctl;
      const help = HELPS[kind];
      const n = nodes[i];
      const target = items[i].d.full;
      const out = h("div", null, h("p", { class: "express-text waiting" }, help.waiting));
      const note = h("p", { class: "express-note" });
      note.hidden = true;
      const stop = h("button", { class: "link-btn", type: "button", onclick: () => ctl.abort() }, "Arrêter");
      const close = h("button", { class: "link-btn", type: "button", onclick: () => { ctl.abort(); n.express.hidden = true; } }, "Fermer");
      n.express.replaceChildren(h("p", { class: "express-head" }, h("span", null, help.head(target)), stop, close), out, note);
      n.express.hidden = false;
      const show = t => out.replaceChildren((kind === "cast" && castList(t)) || h("p", { class: "express-text" }, t));

      const read = items.slice(0, i + 1).map(it =>
        `[${it.d.full}${it.part.title ? ` · ${it.part.title} : ${it.part.name}` : ""}]` +
        (it.cue ? ` (repère : ${it.cue})` : "") + "\n" + it.t
      ).join("\n\n");
      const prompt =
`Tu aides un lecteur qui reprend « ${book.title} » de Stephen King après plusieurs semaines de pause. Il a lu jusqu'à : ${target} (inclus).

Personnages (présentation sans révélation) :
${book.cast.map(([nm, d]) => `- ${nm} : ${d}`).join("\n")}

Résumés de ce qu'il a lu, dans l'ordre :

${read}

${help.task}

Règles strictes :
- Utilise UNIQUEMENT les informations des résumés ci-dessus et de la présentation des personnages.
- N'ajoute rien de ce que tu sais par ailleurs sur ce livre, ses adaptations ou sa suite.
- Ne fais aucune allusion à ce qui se passe après « ${target} » : ni hypothèse, ni présage, ni sous-entendu.
${help.format}`;

      try {
        const { text, truncated } = await ask(prompt, {
          modelTier: "quick",
          cache: { gcTime: 86400000 },
          signal: ctl.signal,
          onText: ({ text }) => show(text)
        });
        show(text);
        if (truncated) { note.textContent = help.cut; note.hidden = false; }
      } catch (e) {
        const code = e && e.code;
        if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
          askBlocked = true;
          paintExpressButtons();
          paintResume();
        }
        const messages = {
          not_granted: "L'aide de Claude n'est pas autorisée sur cette page.",
          sampling_disabled: "L'aide de Claude n'est pas disponible pour ce compte.",
          rate_limited: "Trop de demandes pour le moment : réessayez un peu plus tard.",
          session_expired: "Reconnectez-vous à claude.ai, puis réessayez.",
          refused: "Claude n'a pas pu répondre cette fois-ci.",
          empty_completion: "Claude n'a pas pu répondre cette fois-ci.",
          cancelled: "Arrêté."
        };
        const msg = messages[code] || (["not_declared", "capability_disabled", "capability_removed"].includes(code)
          ? "L'aide de Claude n'est pas disponible ici."
          : "La réponse a été interrompue. Vous pouvez réessayer.");
        if (e && e.text && code !== "refused") { show(e.text); note.textContent = msg; note.hidden = false; }
        else out.replaceChildren(h("p", { class: "express-text" }, msg));
      } finally {
        stop.hidden = true;
        if (running === ctl) running = null;
      }
    }

    const partsEl = [];
    let current = null, list = null;
    items.forEach((it, i) => {
      if (it.part !== current) {
        current = it.part;
        list = h("ol", { class: "items" });
        partsEl.push(h("section", { class: "part" },
          it.part.title ? h("h3", null, h("span", { class: "part-num" }, it.part.title), h("span", { class: "part-name" }, it.part.name)) : null,
          list
        ));
      }
      const bodyId = it.id + "-body";
      const action = h("span", { class: "item-action", "aria-hidden": "true" }, "Afficher");
      const flag = h("span", { class: "flag" }, "marque-page");
      flag.hidden = i !== lastIndex;
      const seen = h("span", { class: "seen" }, "lu");
      seen.hidden = !(lastIndex !== null && i < lastIndex);
      const btn = h("button", {
          class: "item-toggle", type: "button", "aria-expanded": "false", "aria-controls": bodyId,
          onclick: () => {
            const open = !nodes[i].li.classList.contains("open");
            setOpen(i, open);
            if (open) markLast(i);
          }
        },
        h("span", { class: "item-num" }, it.d.num || "·"),
        h("span", { class: "item-label" }, it.d.word ? h("span", { class: "item-word" }, it.d.word) : null, seen, flag),
        action,
        seal()
      );
      btn.setAttribute("aria-label", it.d.full);
      const express = h("div", { class: "express", "aria-live": "polite" });
      express.hidden = true;
      const expressBtn = h("button", { class: "link-btn", type: "button", onclick: () => { markLast(i); runHelp(i, "express"); } }, "Résumé express jusqu'ici");
      expressBtn.hidden = !canAsk() || i < 1;
      const castBtn = h("button", { class: "link-btn", type: "button", onclick: () => { markLast(i); runHelp(i, "cast"); } }, "Qui est qui à ce stade");
      castBtn.hidden = !canAsk();
      // On a fiche before the bookmark: bring the bookmark back here (rereading alone leaves it be).
      const mark = h("button", { class: "link-btn", type: "button", onclick: () => setLast(i) }, "Placer mon marque-page ici");
      mark.hidden = !(lastIndex !== null && i < lastIndex);
      const text = h("p", { class: "item-text" }, it.t);
      const body = h("div", { class: "item-body", id: bodyId },
        it.cue ? h("p", { class: "cue" }, h("b", null, "Repère"), " · " + it.cue) : null,
        text,
        h("div", { class: "item-tools" },
          i > 0 ? h("button", { class: "link-btn", type: "button", onclick: () => { for (let j = 0; j <= i; j++) setOpen(j, true); markLast(i); } }, "Afficher aussi tout ce qui précède") : null,
          mark,
          expressBtn,
          castBtn
        ),
        express
      );
      body.hidden = true;
      // Drawn lines under a seal, never the summary: nothing to read or copy before the click.
      const veil = h("div", { class: "veil", "aria-hidden": "true", onclick: () => btn.click() },
        h("span", { class: "veil-lines" }, h("i"), h("i"), h("i"), seal()),
        h("span", { class: "veil-cue" }, "Brisez le sceau pour lire la suite")
      );
      const li = h("li", { class: "item", id: it.id }, btn, veil, body);
      nodes.push({ li, btn, body, text, action, flag, seen, mark, express, expressBtn, castBtn });
      list.append(li);
    });

    const jump = h("select", { id: "jump-" + book.id, onchange: e => { if (e.target.value !== "") seek(+e.target.value); e.target.value = ""; } },
      h("option", { value: "" }, "Choisir…"),
      items.map(it => h("option", { value: String(it.i) }, it.d.full))
    );

    const endingBody = h("div", { class: "ending-body" },
      h("div", null, h("h3", null, "Analyse"), h("p", null, book.conclusion.analyse)),
      h("div", null, h("h3", null, "Ce que le livre fait ressentir"), h("p", null, book.conclusion.emotions)),
      h("div", null, h("h3", null, "Ce qu'il veut nous dire"), h("p", null, book.conclusion.message))
    );
    endingBody.hidden = true;
    const endingBtn = h("button", { class: "btn btn-accent", type: "button", "aria-expanded": "false", onclick: () => {
      const show = endingBody.hidden;
      endingBody.hidden = !show;
      endingBody.classList.toggle("reveal", show);
      endingBtn.setAttribute("aria-expanded", String(show));
      endingBtn.textContent = show ? "Masquer la conclusion" : "Afficher la conclusion";
    } }, "Afficher la conclusion");

    paintFlags();
    paintResume();
    paintStatus();
    paintLinks();
    view = {
      refresh() {
        lastIndex = storedLast();
        paintFlags();
        paintResume();
        paintStatus();
        paintLinks();
        paintExpressButtons();
      },
      // "Reprendre" from the home page: open the last fiche and bring it into view.
      resume() { if (lastIndex !== null) goTo(lastIndex); }
    };
    const art = book.art ? [h("div", { class: "book-art", "aria-hidden": "true", style: `background-image: url("${book.art}")` })] : [];
    app.replaceChildren(...art, h("div", { class: "wrap" },
      h("nav", { class: "topbar" }, h("a", { class: "back", href: "#" }, "← La bibliothèque")),
      h("header", { class: "book-head" },
        h("div", { class: "book-mark", "aria-hidden": "true", html: motifs[book.cover.motif]() }),
        cover(book),
        h("div", { class: "head-text" },
          h("p", { class: "eyebrow" }, `${book.byline || "Stephen King"} · ${book.year}`),
          h("h1", null, book.title),
          h("p", { class: "book-meta" }, `Titre original : ${book.original} · ${book.meta}`),
          statusBox,
          h("p", { class: "pitch" }, book.pitch),
          resumeBox
        )
      ),
      h("div", { class: "reading" },
        h("details", { class: "cast" },
          h("summary", null, "Personnages", h("small", null, "sans révélation")),
          h("dl", null, book.cast.map(([n, d]) => [h("dt", null, n), h("dd", null, d)]))
        ),
        book.links && book.links.length
          ? h("details", { class: "cast" },
              h("summary", null, "Dans l'univers de King", h("small", null, "liens avec ses autres livres")),
              linksBox
            )
          : null,
        h("section", { class: items.some(it => /–/.test(it.d.num)) ? "chapters ranged" : "chapters", "aria-labelledby": "ch-title" },
          h("div", { class: "chapters-head" },
            h("h2", { id: "ch-title" }, UNIT[book.unit][1]),
            h("div", { class: "tools" },
              h("label", { for: "jump-" + book.id }, "Aller à"),
              jump,
              h("button", { class: "btn", type: "button", onclick: () => nodes.forEach((_, i) => setOpen(i, false)) }, "Tout masquer")
            )
          ),
          h("p", { class: "note" }, book.note),
          partsEl
        ),
        h("section", { class: "ending", "aria-labelledby": "end-title" },
          h("h2", { id: "end-title" }, "Conclusion"),
          h("p", { class: "ending-lock" }, "Analyse du livre, émotions qu'il suscite et ce qu'il veut transmettre. Elle révèle toute l'histoire, fin comprise."),
          endingBtn,
          endingBody
        )
      )
    ));
  }

  // `later`: during a page turn, hand back the jump to the last fiche so it runs once the turn has played.
  function route(later) {
    const [id, action] = decodeURIComponent(location.hash.replace(/^#/, "")).split("/");
    if (id && byId[id]) renderBook(byId[id]);
    else { view = { refresh: renderHome }; renderHome(); }
    window.scrollTo(0, 0);
    if (action === "reprendre" && byId[id]) {
      // Drop the action from the address so "back" and a reload land on the book itself.
      // (A sandboxed frame may refuse it; the action then simply stays in the address.)
      try { history.replaceState(null, "", "#" + id); } catch (e) {}
      const v = view;
      if (later) return () => { if (view === v) v.resume(); };
      view.resume();
    }
    return null;
  }

  /* ---------- Page turns ----------
     Between the shelf and a book, the cover and the book's painting morph into each other (and
     the cover's title into the page title) as a view transition. Back on the shelf, the reader
     lands where they left it, with the book in view. Without view transitions, or when the
     reader asks for less motion, the page simply changes as before. */
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hashBook = () => { const id = decodeURIComponent(location.hash.replace(/^#/, "")).split("/")[0]; return byId[id] ? id : null; };
  let shown = hashBook(); // the book on screen, null for the shelf
  let shelfY = 0;         // where the reader was on the shelf
  let turns = 0;
  const inView = el => { const r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; };
  // A book in hand shows twice on the shelf (under the title, and in its pile): the one in view.
  const shelfCover = id => {
    const covers = [...app.querySelectorAll(`a.reading-card[data-id="${id}"] .cover, a.book-link[href="#${id}"] .cover`)];
    return covers.find(inView) || covers[0];
  };

  // On a book page: its painting (or its cover, for a book without one) and its title.
  // On the shelf: that book's cover and the title printed on it, if it is in view.
  function turnParts(id) {
    if (document.body.dataset.view === "book") return [app.querySelector(".book-art") || app.querySelector(".book-head .cover"), app.querySelector(".head-text h1")];
    const c = shelfCover(id);
    return c && inView(c) ? [c, c.querySelector(".cv-title")] : [];
  }
  function nameTurn(parts, on) {
    ["turn-picture", "turn-title"].forEach((name, k) => { if (parts[k]) parts[k].style.viewTransitionName = on ? name : ""; });
  }

  // A painting is fetched as soon as the pointer or the focus reaches its book, so the cover
  // rarely has to wait for it; a turn still waits a moment rather than open onto an empty frame.
  const warmed = new Set();
  function warm(id) {
    const art = id && byId[id] && byId[id].art;
    if (!art) return null;
    const img = new Image();
    img.src = art;
    warmed.add(id);
    return img;
  }
  const warmLink = e => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    const id = a && a.getAttribute("href").slice(1).split("/")[0];
    if (id && !warmed.has(id)) warm(id);
  };
  ["pointerover", "pointerdown", "focusin"].forEach(t => app.addEventListener(t, warmLink, { passive: true }));
  function artReady(id) {
    const img = warm(id);
    return img ? Promise.race([img.decode().catch(() => {}), new Promise(r => setTimeout(r, 400))]) : null;
  }

  function land(from, to) {
    const resume = route(true);
    if (!to) {
      // The book may have changed piles meanwhile: then bring it into view.
      window.scrollTo(0, shelfY);
      const c = shelfCover(from);
      if (c && !inView(c)) c.scrollIntoView({ block: "center" });
    }
    return resume;
  }

  function turn() {
    const from = shown, to = hashBook();
    if (!from) shelfY = window.scrollY;
    shown = to;
    if (!document.startViewTransition || calm() || from === to) {
      const resume = land(from, to);
      if (resume) resume();
      return;
    }
    const root = document.documentElement, n = ++turns;
    root.dataset.turn = !from ? "open" : !to ? "close" : "swap";
    nameTurn(turnParts(from || to), true);
    let after = [], resume = null;
    const t = document.startViewTransition(async () => {
      resume = land(from, to);
      await artReady(to);
      after = turnParts(to || from);
      nameTurn(after, true);
    });
    t.finished.finally(() => {
      nameTurn(after, false);
      if (n === turns) delete root.dataset.turn; // a newer turn may already be playing
      if (resume) resume();
    });
  }
  window.addEventListener("hashchange", turn);
  route();
})();
</script>
