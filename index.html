    watch: () => {
      let ticks = "";
      for (let i = 0; i < 12; i++) {
        const a = i * 30 * Math.PI / 180, s = Math.sin(a), c = Math.cos(a);
        ticks += `<line x1="${(100 + 35 * s).toFixed(1)}" y1="${(114 - 35 * c).toFixed(1)}" x2="${(100 + 41 * s).toFixed(1)}" y2="${(114 - 41 * c).toFixed(1)}"/>`;
      }
      return `<svg viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#e2c27a"><circle cx="100" cy="51" r="7" stroke-width="2.4"/><circle cx="100" cy="114" r="50" stroke-width="3"/><circle cx="100" cy="114" r="44" stroke-width=".8" opacity=".55"/><g stroke-width="1.6">${ticks}</g></g><rect x="96" y="58" width="8" height="7" fill="#e2c27a"/><g stroke="currentColor" stroke-linecap="round"><path d="M100 114 L105.7 92.7" stroke-width="3"/><path d="M100 114 L100 148" stroke-width="1.8"/></g><circle cx="100" cy="114" r="3.2" fill="#e2c27a"/></svg>`;
    },
    stars: () => {
      const star = (x, y, R) => Array.from({ length: 10 }, (_, i) => {
        const a = (i * 36 - 90) * Math.PI / 180, r = i % 2 ? R * .42 : R;
        return `${(x + r * Math.cos(a)).toFixed(1)},${(y + r * Math.sin(a)).toFixed(1)}`;
      }).join(" ");
      const sky = [[58, 58, 18, .62], [138, 42, 12, .45], [72, 134, 11, .42], [124, 160, 14, .52], [168, 118, 9, .36]];
      return `<svg viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">${sky.map(([x, y, R, o]) => `<polygon points="${star(x, y, R)}" opacity="${o}"/>`).join("")}<polygon points="${star(136, 96, 27)}" stroke-dasharray="3.5 3.5" opacity=".95"/></g></svg>`;
    },
    paw: () => `<svg viewBox="0 0 200 200" aria-hidden="true"><g fill="currentColor" transform="translate(100 112) scale(1.22) translate(-100 -112)"><path d="M100 104 C121 104 138 124 136 141 C134 156 117 153 100 151 C83 153 66 156 64 141 C62 124 79 104 100 104 Z"/><ellipse cx="62" cy="96" rx="11" ry="14" transform="rotate(-28 62 96)"/><ellipse cx="86" cy="74" rx="11" ry="15" transform="rotate(-9 86 74)"/><ellipse cx="114" cy="74" rx="11" ry="15" transform="rotate(9 114 74)"/><ellipse cx="138" cy="96" rx="11" ry="14" transform="rotate(28 138 96)"/></g></svg>`,
    keys: () => {
      const rows = [["Q","W","E","R","T","Y"],["A","S","D","F","G","H"],["Z","X","C","V","B",""]];
      let out = `<svg viewBox="0 0 200 200" aria-hidden="true">`;
      rows.forEach((row, r) => {
        const y = 52 + r * 46, x0 = 100 - (row.length - 1) * 15 + r * 7;
        row.forEach((k, i) => {
          const x = x0 + i * 30;
          if (k) out += `<circle cx="${x}" cy="${y}" r="12.5" fill="#17191b"/><text x="${x}" y="${y + 4.4}" text-anchor="middle" font-family="Courier Prime, Courier New, monospace" font-size="12.5" font-weight="700" fill="#dfe3e4">${k}</text>`;
          else out += `<circle cx="${x}" cy="${y}" r="12.5" fill="none" stroke="#9e2b25" stroke-width="1.4" stroke-dasharray="3 3"/>`;
        });
      });
      return out + `</svg>`;
    }
  };

  /* A book's page takes on its cover's colours: [glow at the top of the page, accent for its
     details]. Keyed by motif like the drawings above, so a new motif needs an entry here too. */
  const AMBIENCE = {
    drop: ["#4a1219", "#d8574b"],
    room217: ["#1b3a2b", "#d1b067"],
    road: ["#3b3524", "#ddb84f"],
    fog: ["#46545b", "#e4ebed"],
    markers: ["#40301f", "#d0b78f"],
    keys: ["#2f383d", "#d24d42"],
    balloon: ["#1f2c33", "#d8574b"],
    flame: ["#3b1c0f", "#e8894a"],
    screen: ["#1f2a30", "#e05a4c"],
    dome: ["#22353b", "#a9d4dc"],
    cuffs: ["#2e2b28", "#cfc8bb"],
    sparrows: ["#1e1e26", "#d9d4c8"],
    house: ["#2e2318", "#e0b552"],
    moon: ["#1a2138", "#e8dcb0"],
    crow: ["#36302a", "#d0584a"],
    seasons: ["#2a2a20", "#e3b54f"],
    dots: ["#163038", "#7fd0dc"],
    corn: ["#2c3220", "#d9b24a"],
    wheel: ["#2f1f33", "#e0b65a"],
    corridor: ["#1d3322", "#8cc07a"],
    watch: ["#3e1916", "#e2c27a"],
    stars: ["#1a1d24", "#c9cfd8"],
    paw: ["#3d2c14", "#e0a64e"]
  };
  function setView(name, book) {
    const style = document.body.style;
    const colours = book && AMBIENCE[book.cover.motif];
    document.body.dataset.view = name;
    if (colours) {
      style.setProperty("--book-glow", colours[0]);
      style.setProperty("--book-accent", colours[1]);
    } else {
      style.removeProperty("--book-glow");
      style.removeProperty("--book-accent");
    }
  }

  function cover(book) {
    const c = h("div", {
      class: "cover",
      "data-motif": book.cover.motif,
      "data-long": book.title.length > 10 ? "" : null,
      style: `--cv-bg:${book.cover.bg};--cv-fg:${book.cover.fg}`,
      role: "img",
      "aria-label": `Couverture : ${book.title}`
    });
    c.append(h("span", { class: "cv" },
      h("span", { class: "cv-author" }, "Stephen King"),
      h("span", { class: "cv-motif", html: motifs[book.cover.motif]() }),
      h("span", { class: "cv-title" }, h("span", { class: "cv-rule" }), book.title)
    ));
    return c;
  }

  /* ---------- Items ---------- */
  const UNIT = {
    chapter: ["Chapitre", "Chapitres", "chapitres"],
    section: ["Section", "Sections", "sections"],
    sequence: ["Séquence", "Séquences", "séquences"]
  };
  function describe(book, it) {
    const prefix = it.n.includes("·") ? it.n.split("·")[0] : null;
    const n = prefix ? it.n.split("·")[1] : it.n;
    const isNum = /^\d+$/.test(n);
    const isRange = /^\d+–\d+$/.test(n);
    const u = UNIT[book.unit];
    let num = isNum || isRange ? n : "Ép.";
    let word, full;
    if (isRange) { word = u[1]; full = it.label || `${u[1]} ${n}`; }
    // A plain number speaks for itself in the list; "Chapitre" is only spelled out in `full`.
    else if (isNum) { word = it.label || ""; full = it.label ? `${u[0]} ${n} · ${it.label}` : `${u[0]} ${n}`; }
    else { word = it.label || n; full = word; }
    if (prefix) full = `Partie ${prefix} · ${full}`;
    return { num, word, full };
  }
  function allItems(book) {
    const list = [];
    book.parts.forEach((p, pi) => p.items.forEach(it => list.push({ ...it, part: p, pi })));
    return list.map((it, i) => ({ ...it, i, id: `${book.id}-${i}`, d: describe(book, it) }));
  }

  /* ---------- Progress ----------
     "Chapitre 12 sur 18": the total is the book's highest chapter number. Books whose numbering
     restarts with each part (Misery) have no single total, so they keep the plain label. */
  function chapterTotal(book) {
    const ns = book.parts.flatMap(p => p.items.map(it => it.n));
    if (ns.some(n => n.includes("·"))) return null;
    const nums = ns.map(n => /^(?:\d+–)?(\d+)$/.exec(n)).filter(Boolean).map(m => +m[1]);
    return nums.length ? Math.max(...nums) : null;
  }
  function progressLabel(book, it) {
    const total = chapterTotal(book);
    return /^(?:\d+–)?\d+$/.test(it.n) && total ? `${it.d.full} sur ${total}` : it.d.full;
  }
  // Share of the book's fiches reached, the last opened one included.
  const progressShare = (book, i) => (i + 1) / allItems(book).length;
  // One tick per fiche, filled up to the last one opened.
  function progressBar(book, i) {
    const count = allItems(book).length;
    const bar = h("span", {
      class: "progress",
      role: "progressbar",
      "aria-label": "Progression dans le livre",
      "aria-valuemin": "0", "aria-valuemax": String(count), "aria-valuenow": String(i + 1)
    });
    for (let j = 0; j < count; j++) bar.append(h("span", { class: j <= i ? "on" : null }));
    return bar;
  }

  /* ---------- Views ---------- */
  // Shelf card for a book waiting or finished (a book in progress gets nowCard).
  function bookCard(b) {
    const e = entry(b.id);
    const line = statusOf(b.id) === "lu" && e.finishedAt
      ? h("span", { class: "done-tag" }, "Terminé le " + fmtDate(e.finishedAt))
      : null;
    return h("li", { class: "shelf-item" },
      h("a", { class: "book-link", href: "#" + b.id },
        h("span", { class: "book-year" }, String(b.year)),
        cover(b),
        h("span", { class: "book-caption" },
          h("strong", null, b.title),
          h("span", null, b.meta),
          line
        )
      )
    );
  }

  // A book in progress, given the full width of its pile: where the reader stopped, and one way back in.
  function nowCard(b) {
    const e = entry(b.id);
    const items = allItems(b);
    const lastItem = Number.isInteger(e.last) ? items[e.last] : null;
    // Part-numbered fiches (Misery) already name their part in the label.
    const where = lastItem && lastItem.part.title && !lastItem.n.includes("·") ? `${lastItem.part.title} · ${lastItem.part.name}` : null;
    const facts = [
      e.startedAt ? "Commencé le " + fmtDate(e.startedAt) : null,
      lastItem ? `${Math.round(progressShare(b, lastItem.i) * 100)} % du livre` : null
    ].filter(Boolean).join(" · ");
    return h("li", { class: "now" },
      h("a", { class: "now-cover book-link", href: "#" + b.id, "aria-label": b.title }, cover(b)),
      h("div", { class: "now-head" },
        h("p", { class: "eyebrow" }, `Stephen King · ${b.year}`),
        h("h3", null, h("a", { href: "#" + b.id }, b.title)),
        lastItem
          ? h("p", { class: "now-where" }, h("b", null, progressLabel(b, lastItem)), where ? " · " + where : null)
          : null
      ),
      h("div", { class: "now-body" },
        lastItem ? progressBar(b, lastItem.i) : null,
        facts ? h("p", { class: "now-facts" }, facts) : null,
        h("div", { class: "now-actions" },
          lastItem
            ? h("a", { class: "btn btn-accent btn-solid", href: `#${b.id}/reprendre` }, "Reprendre la lecture")
            : h("a", { class: "btn btn-accent btn-solid", href: "#" + b.id }, "Ouvrir le livre"),
          h("a", { class: "now-all", href: "#" + b.id }, "Tous les chapitres")
        )
      )
    );
  }

  // A recommended book added to the piles: no summaries yet, so no page — just its status.
  function pendingCard(r) {
    const status = entry(r.id).status;
    const select = h("select", {
        "aria-label": `Statut de ${r.title}`,
        onchange: e => { const v = e.target.value; if (v === "retirer") removeEntry(r.id); else setStatus(r.id, v); }
      },
      [["a-lire", "À lire"], ["en-cours", "En cours"], ["lu", "Lu"], ["retirer", "Retirer de mes piles"]]
        .map(([v, l]) => h("option", { value: v, selected: v === status }, l))
    );
    return h("li", { class: "shelf-item" },
      h("div", { class: "book-link" },
        h("span", { class: "book-year" }, String(r.year)),
        cover(r.cover ? r : { title: r.title, cover: { bg: "#2e3134", fg: "#d8d3c7", motif: "pending" } }),
        h("span", { class: "book-caption" },
          h("strong", null, r.title),
          h("span", null, "Résumés à venir : demandez-les à Claude"),
          mode !== "readonly" ? h("span", { class: "pending-tools" }, select) : null
        )
      )
    );
  }

  // The three best-placed suggestions show first; the rest wait behind a button.
  const RECS_FIRST = 3;
  let recsOpen = false;
  function recsSection() {
    const rank = { "lu": 0, "en-cours": 1, "a-lire": 2 };
    const recs = RECS
      .filter(r => !entry(r.id).status && (!r.gate || statusOf(r.gate) === "lu"))
      .sort((a, z) => rank[statusOf(a.from)] - rank[statusOf(z.from)]);
    if (!recs.length) return null;
    const hidden = recs.length - RECS_FIRST;
    const more = hidden > 0
      ? h("p", { class: "recs-more" },
          h("button", { class: "link-btn", type: "button", "aria-expanded": String(recsOpen), onclick: () => { recsOpen = !recsOpen; refresh(); } },
            recsOpen ? "Afficher moins de suggestions" : `Voir ${hidden > 1 ? `les ${hidden} autres suggestions` : "l'autre suggestion"}`))
      : null;
    return h("section", { class: "recs", "aria-labelledby": "recs-title" },
      h("div", { class: "pile-head" }, h("h2", { id: "recs-title" }, "Que lire ensuite ?")),
      h("p", { class: "recs-intro" }, "Des romans de King choisis pour prolonger ceux de votre bibliothèque. Ajoutez-en un à votre pile ; ses résumés pourront être rédigés quand vous le commencerez."),
      h("ol", { class: "rec-list" }, (recsOpen ? recs : recs.slice(0, RECS_FIRST)).map(r => {
        const src = byId[r.from];
        const lead = statusOf(r.from) === "lu" ? `Parce que vous avez lu ${src.title}` : `Dans la lignée de ${src.title}`;
        return h("li", { class: "rec" },
          r.cover ? h("div", { class: "rec-cover" }, cover(r)) : null,
          h("h3", null, r.title),
          h("p", { class: "rec-meta" }, `${r.original} · ${r.year}`),
          h("p", { class: "rec-why" }, `${lead} · ${r.why}`),
          h("p", { class: "rec-pitch" }, r.pitch),
          mode !== "readonly"
            ? h("div", { class: "rec-action" }, h("button", { class: "btn btn-accent", type: "button", onclick: () => setStatus(r.id, "a-lire") }, "Ajouter à « À lire »"))
            : null
        );
      })),
      more
    );
  }

  // Books in progress get a wide panel; everything else (and recs without summaries yet) stays on the shelf.
  function pileList(p) {
    const shelfOf = list => list.length ? h("ol", { class: "shelf" }, list.map(x => x.kind === "book" ? bookCard(x.b) : pendingCard(x.b))) : null;
    if (p.key !== "en-cours") return shelfOf(p.list);
    const wide = p.list.filter(x => x.kind === "book");
    return [
      wide.length ? h("ol", { class: "now-list" }, wide.map(x => nowCard(x.b))) : null,
      shelfOf(p.list.filter(x => x.kind !== "book"))
    ];
  }

  function renderHome() {
    document.title = "Chapitres en suspens";
    setView("home", null);
    const all = [
      ...books.map(b => ({ kind: "book", b, status: statusOf(b.id) })),
      ...RECS.filter(r => entry(r.id).status).map(r => ({ kind: "rec", b: r, status: entry(r.id).status }))
    ].sort((a, z) => a.b.year - z.b.year);
    const piles = STATUSES.map(s => ({ ...s, list: all.filter(x => x.status === s.key) }));
    const tally = h("p", { class: "tally", "aria-label": "Où j'en suis" },
      piles.map(p => h("span", { class: p.key === "en-cours" ? "is-reading" : null },
        h("b", null, String(p.list.length)), " " + (p.key === "lu" ? (p.list.length > 1 ? "lus" : "lu") : p.label.toLowerCase())
      ))
    );
    app.replaceChildren(h("div", { class: "wrap" },
      h("header", { class: "masthead" },
        h("p", { class: "eyebrow" }, "Carnet de lectures · Stephen King"),
        h("h1", { html: "Chapitres <em>en suspens</em>" }),
        h("p", { class: "lede" }, "Les résumés de vos livres, chapitre par chapitre, pour reprendre une lecture là où vous l'avez laissée. Chaque résumé reste caché tant que vous ne cliquez pas dessus : rien ne vous gâche la suite."),
        tally
      ),
      piles.map(p => h("section", { class: "pile", "data-status": p.key, "aria-labelledby": "pile-" + p.key },
        h("div", { class: "pile-head" },
          h("h2", { id: "pile-" + p.key }, p.pile),
          h("span", { class: "pile-count" }, p.list.length ? `${p.list.length} livre${p.list.length > 1 ? "s" : ""}` : "")
        ),
        p.list.length
          ? pileList(p)
          : h("p", { class: "pile-empty" }, p.empty)
      )),
      recsSection(),
      h("p", { class: "colophon" }, "Les résumés suivent le découpage des éditions originales. Le statut de chaque livre se règle depuis sa page. Un nouveau livre à ajouter ? Il suffit de le demander à Claude."),
      syncSlip()
    ));
  }

  function renderBook(book) {
    document.title = `${book.title} · Chapitres en suspens`;
    setView("book", book);
    const items = allItems(book);
    const nodes = [];
    const storedLast = () => { const v = entry(book.id).last; return Number.isInteger(v) && items[v] ? v : null; };
    let lastIndex = storedLast();

    const resumeBox = h("div", { class: "resume" });
    function paintResume() {
      resumeBox.replaceChildren();
      resumeBox.hidden = lastIndex === null;
      if (lastIndex === null) return;
      resumeBox.append(...[
        h("span", null, "Dernière fiche ouverte : " + progressLabel(book, items[lastIndex])),
        h("button", { class: "link-btn", type: "button", onclick: () => goTo(lastIndex) }, "Y retourner"),
        canAsk() && lastIndex > 0
          ? h("button", { class: "link-btn", type: "button", onclick: () => { const i = lastIndex; goTo(i); runHelp(i, "express"); } }, "Résumé express jusque-là")
          : null,
        canAsk()
          ? h("button", { class: "link-btn", type: "button", onclick: () => { const i = lastIndex; goTo(i); runHelp(i, "cast"); } }, "Qui est qui à ce stade")
          : null
      ].filter(Boolean));
    }

    const linksBox = h("ul", { class: "links" });
    function paintLinks() {
      linksBox.replaceChildren(...(book.links || []).map(l => {
        if (l.gate && statusOf(l.gate) !== "lu") {
          return h("li", { class: "locked" }, `Un autre lien dévoile la fin de ${byId[l.gate].title} : il apparaîtra quand vous aurez marqué ce livre comme lu.`);
        }
        return h("li", null, l.t, l.to && byId[l.to] ? h("a", { href: "#" + l.to }, `Voir ${byId[l.to].title} →`) : null);
      }));
    }

    const statusBox = h("div", { class: "status-box" });
    function paintStatus() {
      const e = entry(book.id);
      const current = statusOf(book.id);
      const dates = [
        e.startedAt ? "Commencé le " + fmtDate(e.startedAt) : null,
        e.finishedAt ? "Terminé le " + fmtDate(e.finishedAt) : null
      ].filter(Boolean).join(" · ");
      const control = mode === "readonly"
        ? h("span", { class: "status-read" }, "Statut : " + STATUSES.find(s => s.key === current).label)
        : h("div", { class: "status", role: "radiogroup", "aria-label": "Statut de lecture" },
            ["a-lire", "en-cours", "lu"].map(key => h("button", {
              type: "button", role: "radio", "aria-checked": String(key === current),
              onclick: () => setStatus(book.id, key)
            }, STATUSES.find(s => s.key === key).label))
          );
      // replaceChildren/append would print a null as the text "null": leave it out instead.
      statusBox.replaceChildren(...[control, dates ? h("span", { class: "status-dates" }, dates) : null].filter(Boolean));
    }

    function setOpen(i, open) {
      const n = nodes[i];
      n.li.classList.toggle("open", open);
      n.btn.setAttribute("aria-expanded", String(open));
      n.body.hidden = !open;
      n.action.textContent = open ? "Masquer" : "Afficher";
    }
    // Everything before the last opened fiche counts as read.
    function paintFlags() {
      nodes.forEach((n, j) => {
        const passed = lastIndex !== null && j < lastIndex;
        n.flag.hidden = j !== lastIndex;
        n.seen.hidden = !passed;
        n.li.classList.toggle("passed", passed);
        n.btn.setAttribute("aria-label", items[j].d.full + (passed ? " · lu" : ""));
      });
    }
    function markLast(i) {
      lastIndex = i;
      paintFlags();
      paintResume();
      if (entry(book.id).last !== i) save(book.id, { last: i });
    }
    function goTo(i) {
      setOpen(i, true);
      markLast(i);
      nodes[i].li.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      nodes[i].btn.focus({ preventScroll: true });
    }

    /* Two helps written by Claude from the summaries the reader has reached, and nothing past them:
       an express recap of the story so far, and who is who at that point. */
    const HELPS = {
      express: {
        head: target => "Résumé express · jusqu'à " + target,
        waiting: "Claude relit vos résumés…",
        cut: "Le résumé a été coupé avant la fin.",
        task: `Écris un « Précédemment dans ${book.title} » en français : un seul paragraphe de 5 à 7 phrases, au présent, qui rappelle l'essentiel de l'histoire jusqu'à ce point : la situation, les personnages importants et où ils en sont, les tensions encore en suspens. Insiste sur ce qui aide à reprendre la lecture.`,
        format: "- Pas de titre, pas de liste, pas de mise en forme : seulement le paragraphe."
      },
      cast: {
        head: target => "Qui est qui · " + target,
        waiting: "Claude fait le point sur les personnages…",
        cut: "La liste a été coupée avant la fin.",
        task: "Dresse la liste des personnages qui comptent à ce stade de sa lecture, du plus important au moins important, 8 au maximum. Pour chacun, dis en une phrase courte qui il est et où il en est à ce point de l'histoire.",
        format: "- Ne cite aucun personnage qui n'apparaît pas encore dans les résumés lus.\n- Une ligne par personnage, sous la forme « Nom | phrase ». Rien d'autre : pas de titre, pas d'introduction, pas de puces."
      }
    };
    function paintExpressButtons() {
      nodes.forEach((n, j) => {
        n.expressBtn.hidden = !canAsk() || j < 1;
        n.castBtn.hidden = !canAsk();
      });
    }
    // "Nom | phrase" lines become a list of names; anything else is left out.
    function castList(text) {
      const rows = String(text).split("\n")
        .map(line => line.replace(/\*\*/g, "").replace(/^\s*[-•*]\s*/, "").split("|"))
        .filter(parts => parts.length >= 2 && parts[0].trim());
      return rows.length
        ? h("dl", { class: "express-cast" }, rows.map(([name, ...rest]) => [h("dt", null, name.trim()), h("dd", null, rest.join("|").trim())]))
        : null;
    }
    let running = null;
    async function runHelp(i, kind) {
      if (!canAsk()) return;
      if (running) running.abort();
      const ctl = new AbortController();
      running = ctl;
      const help = HELPS[kind];
      const n = nodes[i];
      const target = items[i].d.full;
      const out = h("div", null, h("p", { class: "express-text waiting" }, help.waiting));
      const note = h("p", { class: "express-note" });
      note.hidden = true;
      const stop = h("button", { class: "link-btn", type: "button", onclick: () => ctl.abort() }, "Arrêter");
      const close = h("button", { class: "link-btn", type: "button", onclick: () => { ctl.abort(); n.express.hidden = true; } }, "Fermer");
      n.express.replaceChildren(h("p", { class: "express-head" }, h("span", null, help.head(target)), stop, close), out, note);
      n.express.hidden = false;
      const show = t => out.replaceChildren((kind === "cast" && castList(t)) || h("p", { class: "express-text" }, t));

      const read = items.slice(0, i + 1).map(it =>
        `[${it.d.full}${it.part.title ? ` · ${it.part.title} : ${it.part.name}` : ""}]` +
        (it.cue ? ` (repère : ${it.cue})` : "") + "\n" + it.t
      ).join("\n\n");
      const prompt =
`Tu aides un lecteur qui reprend « ${book.title} » de Stephen King après plusieurs semaines de pause. Il a lu jusqu'à : ${target} (inclus).

Personnages (présentation sans révélation) :
${book.cast.map(([nm, d]) => `- ${nm} : ${d}`).join("\n")}

Résumés de ce qu'il a lu, dans l'ordre :

${read}

${help.task}

Règles strictes :
- Utilise UNIQUEMENT les informations des résumés ci-dessus et de la présentation des personnages.
- N'ajoute rien de ce que tu sais par ailleurs sur ce livre, ses adaptations ou sa suite.
- Ne fais aucune allusion à ce qui se passe après « ${target} » : ni hypothèse, ni présage, ni sous-entendu.
${help.format}`;

      try {
        const { text, truncated } = await ask(prompt, {
          modelTier: "quick",
          cache: { gcTime: 86400000 },
          signal: ctl.signal,
          onText: ({ text }) => show(text)
        });
        show(text);
        if (truncated) { note.textContent = help.cut; note.hidden = false; }
      } catch (e) {
        const code = e && e.code;
        if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
          askBlocked = true;
          paintExpressButtons();
          paintResume();
        }
        const messages = {
          not_granted: "L'aide de Claude n'est pas autorisée sur cette page.",
          sampling_disabled: "L'aide de Claude n'est pas disponible pour ce compte.",
          rate_limited: "Trop de demandes pour le moment : réessayez un peu plus tard.",
          session_expired: "Reconnectez-vous à claude.ai, puis réessayez.",
          refused: "Claude n'a pas pu répondre cette fois-ci.",
          empty_completion: "Claude n'a pas pu répondre cette fois-ci.",
          cancelled: "Arrêté."
        };
        const msg = messages[code] || (["not_declared", "capability_disabled", "capability_removed"].includes(code)
          ? "L'aide de Claude n'est pas disponible ici."
          : "La réponse a été interrompue. Vous pouvez réessayer.");
        if (e && e.text && code !== "refused") { show(e.text); note.textContent = msg; note.hidden = false; }
        else out.replaceChildren(h("p", { class: "express-text" }, msg));
      } finally {
        stop.hidden = true;
        if (running === ctl) running = null;
      }
    }

    const partsEl = [];
    let current = null, list = null;
    items.forEach((it, i) => {
      if (it.part !== current) {
        current = it.part;
        list = h("ol", { class: "items" });
        partsEl.push(h("section", { class: "part" },
          it.part.title ? h("h3", null, h("span", { class: "part-num" }, it.part.title), h("span", { class: "part-name" }, it.part.name)) : null,
          list
        ));
      }
      const bodyId = it.id + "-body";
      const action = h("span", { class: "item-action", "aria-hidden": "true" }, "Afficher");
      const flag = h("span", { class: "flag" }, "dernière fiche");
      flag.hidden = i !== lastIndex;
      const seen = h("span", { class: "seen" }, "lu");
      seen.hidden = !(lastIndex !== null && i < lastIndex);
      const btn = h("button", {
          class: "item-toggle", type: "button", "aria-expanded": "false", "aria-controls": bodyId,
          onclick: () => {
            const open = !nodes[i].li.classList.contains("open");
            setOpen(i, open);
            if (open) markLast(i);
          }
        },
        h("span", { class: "item-num" }, it.d.num || "·"),
        h("span", { class: "item-label" }, it.d.word ? h("span", { class: "item-word" }, it.d.word) : null, seen, flag),
        action
      );
      btn.setAttribute("aria-label", it.d.full);
      const express = h("div", { class: "express", "aria-live": "polite" });
      express.hidden = true;
      const expressBtn = h("button", { class: "link-btn", type: "button", onclick: () => { markLast(i); runHelp(i, "express"); } }, "Résumé express jusqu'ici");
      expressBtn.hidden = !canAsk() || i < 1;
      const castBtn = h("button", { class: "link-btn", type: "button", onclick: () => { markLast(i); runHelp(i, "cast"); } }, "Qui est qui à ce stade");
      castBtn.hidden = !canAsk();
      const body = h("div", { class: "item-body", id: bodyId },
        it.cue ? h("p", { class: "cue" }, h("b", null, "Repère"), " · " + it.cue) : null,
        h("p", { class: "item-text" }, it.t),
        h("div", { class: "item-tools" },
          i > 0 ? h("button", { class: "link-btn", type: "button", onclick: () => { for (let j = 0; j <= i; j++) setOpen(j, true); markLast(i); } }, "Afficher aussi tout ce qui précède") : null,
          expressBtn,
          castBtn
        ),
        express
      );
      body.hidden = true;
      const li = h("li", { class: "item", id: it.id }, btn, body);
      nodes.push({ li, btn, body, action, flag, seen, express, expressBtn, castBtn });
      list.append(li);
    });

    const jump = h("select", { id: "jump-" + book.id, onchange: e => { if (e.target.value !== "") goTo(+e.target.value); e.target.value = ""; } },
      h("option", { value: "" }, "Choisir…"),
      items.map(it => h("option", { value: String(it.i) }, it.d.full))
    );

    const endingBody = h("div", { class: "ending-body" },
      h("div", null, h("h3", null, "Analyse"), h("p", null, book.conclusion.analyse)),
      h("div", null, h("h3", null, "Ce que le livre fait ressentir"), h("p", null, book.conclusion.emotions)),
      h("div", null, h("h3", null, "Ce qu'il veut nous dire"), h("p", null, book.conclusion.message))
    );
    endingBody.hidden = true;
    const endingBtn = h("button", { class: "btn btn-accent", type: "button", "aria-expanded": "false", onclick: () => {
      const show = endingBody.hidden;
      endingBody.hidden = !show;
      endingBody.classList.toggle("reveal", show);
      endingBtn.setAttribute("aria-expanded", String(show));
      endingBtn.textContent = show ? "Masquer la conclusion" : "Afficher la conclusion";
    } }, "Afficher la conclusion");

    paintFlags();
    paintResume();
    paintStatus();
    paintLinks();
    view = {
      refresh() {
        lastIndex = storedLast();
        paintFlags();
        paintResume();
        paintStatus();
        paintLinks();
        paintExpressButtons();
      },
      // "Reprendre" from the home page: open the last fiche and bring it into view.
      resume() { if (lastIndex !== null) goTo(lastIndex); }
    };
    const art = book.art ? [h("div", { class: "book-art", "aria-hidden": "true", style: `background-image: url("${book.art}")` })] : [];
    app.replaceChildren(...art, h("div", { class: "wrap" },
      h("nav", { class: "topbar" }, h("a", { class: "back", href: "#" }, "← La bibliothèque")),
      h("header", { class: "book-head" },
        h("div", { class: "book-mark", "aria-hidden": "true", html: motifs[book.cover.motif]() }),
        cover(book),
        h("div", { class: "head-text" },
          h("p", { class: "eyebrow" }, `${book.byline || "Stephen King"} · ${book.year}`),
          h("h1", null, book.title),
          h("p", { class: "book-meta" }, `Titre original : ${book.original} · ${book.meta}`),
          statusBox,
          h("p", { class: "pitch" }, book.pitch),
          resumeBox
        )
      ),
      h("div", { class: "reading" },
        h("details", { class: "cast" },
          h("summary", null, "Personnages", h("small", null, "sans révélation")),
          h("dl", null, book.cast.map(([n, d]) => [h("dt", null, n), h("dd", null, d)]))
        ),
        book.links && book.links.length
          ? h("details", { class: "cast" },
              h("summary", null, "Dans l'univers de King", h("small", null, "liens avec ses autres livres")),
              linksBox
            )
          : null,
        h("section", { class: "chapters", "aria-labelledby": "ch-title" },
          h("div", { class: "chapters-head" },
            h("h2", { id: "ch-title" }, UNIT[book.unit][1]),
            h("div", { class: "tools" },
              h("label", { for: "jump-" + book.id }, "Aller à"),
              jump,
              h("button", { class: "btn", type: "button", onclick: () => nodes.forEach((_, i) => setOpen(i, false)) }, "Tout masquer")
            )
          ),
          h("p", { class: "note" }, book.note),
          partsEl
        ),
        h("section", { class: "ending", "aria-labelledby": "end-title" },
          h("h2", { id: "end-title" }, "Conclusion"),
          h("p", { class: "ending-lock" }, "Analyse du livre, émotions qu'il suscite et ce qu'il veut transmettre. Elle révèle toute l'histoire, fin comprise."),
          endingBtn,
          endingBody
        )
      )
    ));
  }

  function route() {
    const [id, action] = decodeURIComponent(location.hash.replace(/^#/, "")).split("/");
    if (id && byId[id]) renderBook(byId[id]);
    else { view = { refresh: renderHome }; renderHome(); }
    window.scrollTo(0, 0);
    if (action === "reprendre" && byId[id]) {
      // Drop the action from the address so "back" and a reload land on the book itself.
      // (A sandboxed frame may refuse it; the action then simply stays in the address.)
      try { history.replaceState(null, "", "#" + id); } catch (e) {}
      view.resume();
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
