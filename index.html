   lake, her white dress soaked in blood, the bucket at her feet. Only once Carrie has been read. */
.dock-carrie { position: absolute; left: 44.9%; top: 2%; width: 7.14%; aspect-ratio: 70 / 100; pointer-events: none; }
/* The other books' keepsakes, each once its book is read (see ROYAL, CHURCH, LION) */
.dock-relic { position: absolute; pointer-events: none; }
.dock-relic svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dock-royal { left: 62.4%; top: 76.6%; width: 6.53%; aspect-ratio: 64 / 46; }
.dock-church { left: 36.2%; top: 51%; width: 3.06%; aspect-ratio: 30 / 40; }
.dock-church .ch-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: cat-blink 7.5s ease-in-out infinite; }
@keyframes cat-blink { 0%, 93%, 100% { transform: none; } 95.5% { transform: scaleY(.08); } }
.dock-lion { left: calc(90% + var(--shift, 0%)); top: 57.4%; width: 10%; aspect-ratio: 120 / 100; }
/* The nearest things: lily pads and a stump (one drawing over the dock's), the canoe tied up
   under the lantern, rocking a little, and the reeds swaying, each clump on its own */
.dock { --reed: color-mix(in srgb, var(--tree-near) 78%, #34452b); --reed-head: #2f1e13; }
.dock-front, .dock-front svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.lily-bloom { display: none; }
.dock-canoe { position: absolute; left: 70.2%; top: 62.67%; width: 18.37%; aspect-ratio: 200 / 60; transform-origin: 50% 60%; animation: canoe-rock 7s ease-in-out infinite alternate; }
.dock-canoe svg, .dock-reeds svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
@keyframes canoe-rock { from { transform: rotate(-.5deg); } to { transform: rotate(.6deg) translateY(.15cqi); } }
.dock-reeds { position: absolute; transform-origin: 50% 100%; pointer-events: none; animation: reed-sway var(--d) ease-in-out var(--w) infinite alternate; }
/* The swaying clumps stand in a box that clips them: leaning past the foot of the page, they would
   change its size at every frame, and the whole page would be repainted. */
.dock-reedbed { position: absolute; inset: 0; overflow: clip; pointer-events: none; }
@keyframes reed-sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.6deg); } }
/* The seasons (script: body[data-season]). Autumn: reeds turning, leaves falling over the lake.
   Winter: dry reeds, snow falling, no lily pads, no moths. Summer: lilies in bloom, fireflies. */
body[data-season="autumn"] .dock { --reed: color-mix(in srgb, var(--tree-near) 72%, #5a4524); }
body[data-season="winter"] .dock { --reed: #4a4636; --reed-head: #2a2016; }
body[data-season="winter"] .lily, body[data-season="winter"] .moths { display: none; }

        { n: `1`, cue: `Les vestiaires du lycée, après le cours de sport.`, t: `Sous la douche, Carrie a ses premières règles. Sa mère ne lui a jamais rien expliqué : elle croit qu'elle se vide de son sang. Les autres filles, menées par Chris Hargensen et suivies par Sue Snell, la bombardent de serviettes hygiéniques en lui criant de « boucher ça ». Miss Desjardin intervient, d'abord agacée, puis comprend et conduit Carrie chez M. Morton, qui la renvoie chez elle. Dans le bureau, un cendrier tombe tout seul. Des extraits de documents évoquent déjà une « pluie de pierres » survenue des années plus tôt.` },
        { n: `2`, cue: `Carrie rentre seule à pied.`, t: `Sur le chemin, Carrie rumine sa colère et, d'un simple regard, fait tomber de vélo un gamin qui se moque d'elle. Un long témoignage d'une ancienne voisine, Estelle Horan, raconte « le jour des pierres » : Carrie avait trois ans, sa mère l'avait surprise à parler de la poitrine de la voisine en maillot, et une pluie de glace puis de pierres s'était abattue sur la seule maison des White. Seule à la maison, Carrie se regarde dans le miroir avec dégoût ; le miroir se brise.` },
        { n: `3`, cue: `Margaret White rentre du travail.`, t: `Prévenue par l'école, Margaret rentre plus tôt. Pour elle, les règles sont la marque du péché : elle traîne Carrie jusqu'au placard de prière. Pour la première fois, Carrie se rebelle et menace de « faire revenir les pierres ». Margaret la laisse sortir plus tôt que d'habitude, et Carrie comprend que sa mère a peur d'elle. Le soir, Sue confie à Tommy la honte qu'elle éprouve.` },
        { n: `4`, cue: `Le lendemain, au lycée.`, t: `Miss Desjardin punit les filles : une semaine de retenue avec elle, sous peine d'être privées du bal de fin d'année. Chris refuse et lui tient tête ; Desjardin la plaque contre un casier. Chris perd sa place au bal, et son père avocat tente en vain de faire plier l'école. Elle rumine sa vengeance. Restée chez elle, Carrie s'exerce à déplacer des objets par la pensée et sent son pouvoir grandir.` },
        { n: `5`, cue: `Sue Snell prend une décision.`, t: `Rongée par la culpabilité, Sue demande à Tommy d'inviter Carrie au bal à sa place, pour lui offrir une soirée normale. Tommy accepte à contrecœur. Carrie croit d'abord à une nouvelle blague, puis dit oui. Elle l'annonce à sa mère, qui hurle au péché : Carrie la fait taire grâce à son pouvoir et commence à coudre sa robe.` },
        { n: `6`, cue: `Chris Hargensen et Billy Nolan.`, t: `Privée de bal, Chris convainc Billy de l'aider à humilier Carrie. Une nuit, avec sa bande, il se rend dans une ferme, tue deux cochons et recueille leur sang dans deux seaux. La première partie se referme sur ce piège en préparation.` }

        { n: `7`, cue: `Le jour du bal.`, t: `Billy a installé les seaux au-dessus de la scène, juste au-dessus des trônes du roi et de la reine. Carrie se prépare dans la robe qu'elle a cousue, pendant que Margaret prie et la supplie de renoncer. Tommy vient la chercher. Sue, sans cavalier, reste chez elle ; Chris se cache derrière la scène et Billy attend sur le parking.` },
        { n: `8`, cue: `L'arrivée au gymnase.`, t: `Carrie découvre le décor et passe une soirée inattendue : elle remet à sa place une fille moqueuse, Tommy est attentionné, et Miss Desjardin vient lui dire qu'elle est belle. Chez elle, Margaret, persuadée que le pouvoir de sa fille vient du démon, aiguise un couteau. Au vote du roi et de la reine, Carrie et Tommy l'emportent d'une seule voix. Ils montent sur les trônes. Derrière la scène, Chris tire la corde.` },
        { n: `9`, cue: `Les seaux se renversent.`, t: `Le sang de porc inonde Carrie, et un seau assomme Tommy. Après un silence, la salle éclate de rire. Carrie s'enfuit, puis se retourne : elle verrouille les portes par la pensée et déclenche les arrosages automatiques. L'eau sur les câbles électriques électrocute les élèves, et le gymnase prend feu. Presque personne n'en sort vivant, Tommy compris.` },
        { n: `10`, cue: `Carrie marche vers le centre-ville.`, t: `Couverte de sang, Carrie traverse Chamberlain et déchaîne sa colère : elle fait exploser des stations-service et une conduite de gaz, et la ville s'embrase. Les secours sont débordés. Témoignages et rapports reconstituent le chaos. Sue comprend que Carrie est à l'origine de tout et part vers la ville. Carrie entre dans une église pour prier.` },
        { n: `11`, cue: `Carrie sort de l'église.`, t: `Elle arrache des câbles électriques et foudroie la foule de Carlin Street. Rentrée chez elle, elle retrouve sa mère, qui lui avoue l'avoir toujours vue comme le fruit du péché. Pendant une dernière prière, Margaret la poignarde à l'épaule ; Carrie arrête son cœur par la pensée. Mortellement blessée, elle rejoint le bar The Cavalier, où Chris et Billy tentent de l'écraser : elle prend le contrôle de leur voiture, qui s'écrase contre le bâtiment et prend feu. Sue la retrouve agonisante sur le parking. Par un dernier contact mental, Carrie comprend que Sue ne l'avait pas trahie, puis meurt. Sue s'enfuit et, dans un champ, se met à saigner.` }

    emotions: `D'abord le malaise et la honte, dans la scène des vestiaires. Puis une pitié profonde pour Carrie, et une tension qui monte avec l'espoir fragile du bal : on voudrait que tout se passe bien, tout en sachant que non. Vient ensuite l'effroi, mêlé de vertige, quand la vengeance devient un massacre aveugle. La fin laisse une tristesse froide.`,
    message: `Le harcèlement n'est jamais anodin : chaque moquerie et chaque silence nourrissent quelque chose. King montre aussi les ravages d'une éducation fondée sur la honte du corps et la peur du péché. Mais il refuse les camps trop simples : Sue tente sincèrement de réparer sa faute, et c'est cette bonne intention qui déclenche le drame. Le livre pose la question de la responsabilité collective, et de ce qui arrive quand une personne n'a plus aucun endroit où être protégée.`

        { n: `4`, t: `La mère du jeune Percy tente de récupérer son fils et se fait arrêter. Plusieurs garçons tombent dans une longue côte. Garraty somnole et rêve de Jan et de sa mère. À la nuit tombée, Stebbins raconte qu'il a vu passer la Marche quand il avait treize ans.` },
        { n: `5`, t: `Les conversations deviennent absurdes pour tenir. On annonce un pont coupé qui imposerait une pause ; Olson exulte, mais le pont est réparé à temps. Barkovitch provoque Rank jusqu'à ce que celui-ci, fou de rage, soit abattu ; Baker et McVries le traitent d'assassin. À minuit, Garraty et McVries s'avouent qu'ils ne pensent pas gagner.` },

        { n: `13`, t: `Une crampe oblige Garraty à s'asseoir ; il reçoit ses trois avertissements, mais repart à quelques secondes de la fin. Avec McVries, il prend la tête du peloton pour effacer ses avertissements. Ils racontent comment ils ont été sélectionnés. Abraham explique que c'est une dissertation provocatrice, écrite pour plaisanter, qui l'a mené ici.` },
        { n: `14`, t: `Après Augusta, la foule devient une sorte de monstre. Parker avoue qu'il a peur et le mal du pays. Garraty affronte Barkovitch, à bout, et le fait pleurer avant d'en avoir honte. Quince est abattu. Barkovitch, devenu fou, s'arrache la gorge.` },

      items: [
        { n: `I·1–2`, label: `Chapitres 1 et 2`, t: `Des sons sans suite, dans un brouillard de douleur. Paul Sheldon reprend peu à peu conscience : sa douleur va et vient comme la marée qui, sur une plage de son enfance, couvrait et découvrait un vieux pilier. Il cesse de respirer ; une bouche à l'haleine fétide lui insuffle de l'air et une voix lui crie de respirer. Dans un rêve, il comprend que les piliers, ce sont ses jambes brisées. Il se réveille dans un lit. La femme assise à côté de lui, un de ses livres à la main, lui dit qu'ils sont à Sidewinder, au Colorado. Elle s'appelle Annie Wilkes, et Paul termine sa phrase : sa fan numéro un.` },
        { n: `I·3`, t: `On lui fait avaler des cachets au goût amer. Paul se rappelle qu'il écrit des romans, des bons et des best-sellers, mais il ne sait plus comment il a atterri dans ce lit. Il flotte entre la douleur, ses souvenirs de la plage et le présent.` },

        { n: `I·6`, t: `Paul se souvient. À l'hôtel Boulderado, à Boulder, il venait d'achever Fast Cars, un roman « sérieux », après avoir fait mourir Misery dans L'Enfant de Misery. Il a fêté ça au champagne puis, au lieu de rentrer à New York, il a pris la route vers l'ouest, ivre, en pleine tempête, et sa voiture s'est retournée. Annie l'a tiré de l'épave, les jambes broyées. Il est resté inconscient près de deux semaines, nourri par perfusion, et il lui doit la vie, dit-elle. Quand il réclame du Novril, elle le fait attendre encore une heure.` },

        { n: `I·9`, t: `Le lendemain matin, en lui donnant sa soupe, Annie se trahit : elle a été infirmière. Elle n'aime pas Fast Cars, trop grossier à son goût. Quand Paul défend la façon de parler de son personnage, elle se met en colère, évoque le jour où elle était « à la barre » à Denver, renverse la soupe et fracasse le bol contre le mur. Puis elle reste figée, absente. Revenue à elle, elle rappelle à Paul, qui s'excuse, qu'il dépend entièrement d'elle.` },
        { n: `I·10`, t: `Annie prend tout son temps pour nettoyer le mur avec un seau et un chiffon, pendant que Paul la supplie de lui donner ses cachets. Elle finit par lui en tendre trois et l'oblige à les avaler avec l'eau sale du seau. Paul promet de ne plus jamais la contrarier ; elle lui dit qu'elle l'aime, et il s'endort.` },
        { n: `I·11`, t: `Au réveil, Annie est partie s'occuper des bêtes à la grange. Paul a honte d'avoir bu l'eau sale. Il comprend que l'exemplaire de Fast Cars qu'Annie a entre les mains est le seul qui existe. Il se demande pourquoi elle n'est plus infirmière et devine que ses collègues ont dû remarquer sa folie. Il pense à un oiseau exotique vu au zoo de Boston, si loin de chez lui : le monde extérieur, désormais, c'est l'« Afrique ». Il s'endort en essayant d'imaginer Annie à la barre, à Denver.` },
        { n: `I·12`, t: `Paul fait un cauchemar : une longue salle d'hôpital remplie de Paul identiques, et Annie, en uniforme d'infirmière, qui leur jette du sable au visage. À son réveil, Annie a presque terminé L'Enfant de Misery ; il lui dit avoir rêvé de l'Afrique.` },
        { n: `I·13`, t: `Le lendemain matin, Annie entre dans une rage folle : elle a fini le livre, et Misery y meurt en couches. Elle insulte Paul, lui renverse une carafe d'eau dessus et la jette contre la porte. Paul tente de se justifier : la fin l'a surpris lui-même. Pour Annie, un écrivain est comme Dieu, il décide de tout. Elle se fige ; Paul cherche des yeux de quoi se défendre. Puis elle part, de peur de commettre l'irréparable, en l'enfermant à clé, sans ses médicaments.` },
        { n: `I·14`, t: `Annie est partie depuis 51 heures ; Paul compte le temps au stylo sur son bras. La douleur, la faim, la soif et le manque se relaient. Il découvre pour la première fois ses jambes : Annie les a éclissées avec des tiges d'acier, elles sont tordues, et son genou gauche semble avoir disparu. Le deuxième jour, la soif le pousse à boire sa propre urine. Il se demande si Annie s'est suicidée, et souhaite mourir.` },
        { n: `I·15`, t: `Annie revient enfin, en robe et chapeau, comme pour une grande occasion ; Paul se demande si c'est la tenue qu'elle portait à Denver. Elle lui donne de l'eau, mais exige qu'il l'écoute avant d'avoir ses cachets : elle a réfléchi et prié, et elle est convaincue que Dieu l'a envoyée pour lui montrer le chemin.` },
        { n: `I·16`, t: `Annie installe un petit barbecue dans la chambre, avec des allumettes, et pose à côté le manuscrit de Fast Cars : avant d'avoir ses médicaments, Paul doit le brûler. Il pense à la facilité avec laquelle il aurait pu en faire une copie, et voit Annie comme une catastrophe naturelle.` },
        { n: `I·17–18`, label: `Chapitres 17 et 18`, t: `Pour Annie, ce manuscrit est sale et mauvais. Paul refuse de le brûler et la traite de diable ; elle se compare à une mère qui agit pour le bien de son enfant, menace de ne plus lui apporter de cachets, puis lui en promet quatre. Paul pèse ses 190 000 mots contre la douleur. Annie refuse de s'en charger elle-même : il doit le brûler de son plein gré, au moins quelques pages. Le manque l'emporte, et Paul cède.` },
        { n: `I·19`, t: `Paul brûle la page de titre, en se rappelant le jour où il a commencé ce roman, deux ans plus tôt. Annie lui tend ensuite des pages une à une (elle a noirci les gros mots au feutre), puis jette le reste dans le barbecue. Effrayée par la taille des flammes, elle court chercher de l'eau, et Paul savoure sa peur. Elle noie le feu, ne laissant qu'une bouillie détrempée, et lui donne enfin ses cachets. Paul se promet de la tuer.` },
        { n: `I·20`, t: `Paul se réveille assis : Annie lui tire les oreilles pour qu'il mange, et après une cuillerée, la faim revient. Elle l'a installé dans un fauteuil roulant, les jambes surélevées ; sa force le stupéfie. Elle veut changer ses draps, et le changer, lui. Paul la remercie tout en s'imaginant la tuer. Rester assis réveille la douleur ; il hurle, et Annie lui apporte du Novril.` },
        { n: `I·21`, t: `Annie lui annonce qu'elle lui a acheté deux cadeaux en ville : le fauteuil roulant, et un autre qu'elle lui montrera demain.` },
        { n: `I·22`, t: `Paul fait ses calculs : la distance jusqu'aux Roydman, les voisins, et jusqu'à Sidewinder. Personne ne semble encore le chercher ; sa voiture, une Camaro, est sans doute enfouie sous la neige, peut-être par un chasse-neige. Annie est psychotique, mais pas stupide. Si la voiture est retrouvée et qu'un policier vient frapper chez elle, tout sera découvert : l'enlèvement, les médicaments donnés en cachette, et elle a déjà eu affaire à la justice. Paul comprend qu'elle le tuera plutôt, et que la voiture réapparaîtra au printemps. Il ne trouve pas le sommeil.` },
        { n: `I·23`, t: `Le lendemain, Annie apporte le second cadeau : une vieille machine à écrire Royal. Paul a l'impression qu'elle lui sourit méchamment ; Annie se vexe quand il la traite d'antiquité. Il manque la touche « n » : Paul plaisante sur le prénom de son infirmière préférée, qui en compte deux, et Annie rougit. Elle a scié une planche à poser sur les accoudoirs du fauteuil et acheté du papier. Avec tout ça, dit-elle, il va écrire son meilleur roman : Le Retour de Misery.` },
        { n: `I·24`, t: `Pour Annie, ce livre est le juste prix de ses soins. Paul proteste que Misery est morte, mais commence malgré lui à imaginer son retour. Il demande si elle le laissera partir une fois le livre fini ; elle s'étonne qu'il se sente prisonnier et promet que oui. Il n'en croit rien. Il lui emprunte ses romans Misery pour s'y retrouver dans les détails ; elle parle déjà de relier le livre elle-même, lui envoie un baiser et sort. Paul décide d'écrire pour survivre.` },
        { n: `I·25`, t: `Annie lui sert un repas copieux pour le mettre au travail et le soulève jusque dans le fauteuil ; sa force l'effraie de nouveau. En invoquant une superstition d'écrivain, Paul lui demande de tourner la machine à écrire vers le mur.` },
        { n: `I·26`, t: `Cette nuit-là, Paul rêve d'Annie dans une cour orientale, qui raconte des histoires sur un tapis volant.` },
        { n: `I·27`, t: `Au matin, Annie, ravie, lui apporte son petit déjeuner. Paul comprend que la vraie Shéhérazade, c'est lui : il doit écrire une histoire assez bonne pour lui sauver la vie. Il vivra tant que le livre ne sera pas fini.` },
        { n: `I·28`, t: `Pour la première fois, Annie roule le fauteuil jusqu'à la fenêtre. Paul découvre la propriété, isolée entre forêt et montagnes, et une grange rouge impeccable : Annie l'entretient pour sauver les apparences. Elle lui montre les stalactites de glace qui fondent. Paul pense aussitôt à sa voiture, qui réapparaîtra avec la fonte des neiges, peut-être découverte par les Roydman : le temps qui lui reste vient de raccourcir. Annie, elle, a hâte qu'il commence.` },
        { n: `I·29`, t: `Paul demande un autre papier : celui d'Annie bave sous l'encre. Elle se vexe, l'accuse de chercher des excuses pour ne pas écrire, et s'indigne qu'il parle de son travail comme d'un commerce. Paul affirme être de son côté et ne penser qu'à la qualité du manuscrit. Elle décide d'aller acheter du papier sur-le-champ, sans lui laisser de cachets, se rue sur lui et frappe son genou brisé. Personne ne l'entendra crier, dit-elle : les gens évitent sa maison.` },
        { n: `I·30`, t: `Seul, sans médicaments, Paul décide de trouver la réserve de Novril. Il amène le fauteuil jusqu'à la porte fermée à clé et repère par terre une épingle à cheveux tombée du chignon d'Annie ; il hurle de douleur pour l'attraper. Il se souvient qu'en se documentant pour Fast Cars, un ancien policier, Tom Twyford, lui a appris à crocheter une serrure avec une épingle.` },
        { n: `I·31`, t: `Par le trou de la serrure, Paul aperçoit un couloir et une porte : sans doute la salle de bain du rez-de-chaussée, où doivent être ses cachets. Il manque de lâcher l'épingle, perd connaissance un instant, puis s'acharne. L'épingle se casse dans la serrure, mais la porte s'ouvre. Le fauteuil est trop large : Paul force le passage et s'évanouit de nouveau.` },
        { n: `I·32`, t: `Annie surgit, un fusil braqué sur Paul, et lui propose de le libérer pour de bon.` },
        { n: `I·33`, t: `Ce n'était qu'un cauchemar. Paul roule jusqu'à la salle de bain : l'armoire à pharmacie est hors d'atteinte, mais dans un placard il trouve des cartons d'échantillons, et enfin le Novril. Il avale quatre gélules, en prend une trentaine pour sa réserve et remet le carton en place. Une voiture passe, il panique. Puis, poussant sa chance, il entre dans le salon, sous le portrait de la mère d'Annie, cherche un téléphone, fait tomber un pingouin en céramique et le rattrape. Le téléphone est branché, mais la ligne est morte. Une autre voiture approche : Paul sait que c'est Annie.` },
        { n: `I·34`, t: `Paul fonce vers sa chambre, heurte le chambranle en y laissant une petite marque, et repasse la porte au moment où Annie s'engage dans l'allée. Le bout d'épingle cassé bloque la serrure ; il s'acharne et parvient à refermer juste quand Annie l'appelle joyeusement. Il retourne près de la fenêtre en espérant qu'elle ne remarquera aucune trace, et se demande s'il a bien remis le pingouin à sa place. Quand elle ouvre, il s'aperçoit que les boîtes de Novril sont encore sur ses genoux.` },
        { n: `I·35`, t: `Annie remarque qu'il est en sueur et lui demande s'il a besoin d'autre chose, une menace à peine voilée de repartir ; qu'il ne la mette plus en colère. En larmes, Paul prétend avoir besoin de l'urinal, ce qui explique ses mains posées sur ses genoux ; dès qu'elle sort, il fourre les boîtes dans son caleçon. Annie revient avec l'urinal et deux cachets. Pour l'instant, elle ne se doute de rien.` },
        { n: `I·36`, t: `Paul demande à Annie d'attendre que les cachets agissent avant de le recoucher, et profite de son absence pour cacher le Novril sous son matelas. Il sombre et se réveille quatorze heures plus tard : il neige.` }
      ]
    },
    {
      title: `Deuxième partie`, name: `Misery`,
      items: [
        { n: `II·1`, t: `Premier chapitre du Retour de Misery, dédié à Annie Wilkes ; les « n » y sont ajoutés à la main. Ian Carmichael rentre chez lui, dans la campagne anglaise, bouleversé : sa femme, Misery, a frôlé la mort après avoir accouché, mais son ami Geoffrey a ramené le médecin à temps. La gouvernante, Mrs Ramage, l'accueille ; Ian entend son fils pleurer, retrouve Misery et lui jure qu'il serait mort avec elle.` },
        { n: `II·2`, t: `Annie aime le chapitre, mais il n'est « pas juste » : c'est de la triche, puisque dans L'Enfant de Misery, Geoffrey n'arrivait pas à temps chez le médecin. Elle se souvient des feuilletons du samedi au cinéma, dans son enfance : le jour où le héros s'en était sorti d'une façon impossible, en contredisant l'épisode précédent, elle avait enragé. Paul a honte, car elle a raison. Elle exige qu'il répare cette injustice, et il sait que s'il ne ramène pas Misery d'une façon crédible, elle le tuera.` },
        { n: `II·3`, t: `Seul, Paul s'imagine en dispute avec la machine à écrire, qui se moque de son échec. Sa douleur diminue, mais il se sait dépendant : les boîtes cachées sous son matelas indiquent que le Novril est à base de codéine. Il décide de sauter quelques prises pour se sevrer, dès qu'il aura écrit un chapitre qui plaise à Annie. Il redoute la prochaine punition.` },
        { n: `II·4`, t: `Paul recommence Le Retour de Misery. Il cherche un moyen de ramener Misery qui soit loyal, à défaut d'être réaliste, et s'assoupit. Il se rappelle un jeu de colonie de vacances où chacun avait dix secondes pour tirer un héros d'une situation impossible, sous peine de quitter le cercle. Paul y excellait, et il pense pouvoir trouver une solution qui satisfera Annie. Mais la machine à écrire l'accuse de tricher.` },
        { n: `II·5`, t: `À son réveil, Paul entend Annie faire la vaisselle en silence : il sent venir une de ses crises de dépression. Il distingue « essayer d'avoir une idée », le travail laborieux de son imagination, et « avoir une idée », qui arrive par hasard, comme Fast Cars lui est venu en voyant un voiturier forcer une portière. D'habitude, son remède, c'est l'ennui et la marche. Assis dans son fauteuil, il attend l'étincelle… et l'idée arrive enfin. Il écrit d'abord par à-coups, puis de plus en plus vite, sans même voir Annie qui l'observe depuis la porte, jusqu'à ce qu'elle l'arrête. Il dort cette nuit-là sans rêver.` },
        { n: `II·6`, t: `La nouvelle version du Retour de Misery. Un fossoyeur, Colter, vient réveiller Geoffrey, encore blessé depuis la nuit de la mort de Misery, trois jours plus tôt : il entend gratter dans la tombe. Geoffrey se rappelle le teint encore rose de Misery, et une phrase du vieux docteur Shinebone sur une certaine Miss Evelyn-Hyde. Il court chez Mrs Ramage, qui comprend aussitôt : comme Miss Evelyn-Hyde, au village voisin, qu'on avait crue morte et dont la main était sortie de terre quatre jours après l'enterrement, Misery a été enterrée vivante. Au cimetière, ils entendent des ongles gratter le bois ; Mrs Ramage se met à creuser à mains nues.` },
        { n: `II·7`, t: `Annie a lu cette deuxième version : c'est loyal, même si ça ne ressemble pas aux autres Misery. Paul accepte qu'elle lise au fur et à mesure, à condition qu'elle remplisse les « n ». Timidement, Annie suggère que Misery pourrait être allergique au venin d'abeille : elle a vu des patients tomber dans le coma ainsi. Paul n'y croit pas mais ne la contredit pas. En la regardant sortir, il remarque sur le chambranle les marques laissées par son fauteuil et, effrayé, ne parvient plus à travailler.` },
        { n: `II·8`, t: `Le lendemain matin, Annie entre en panique, menotte Paul au lit et le bâillonne avec un vieux chiffon : une voiture arrive. S'il fait le moindre bruit, elle tuera le visiteur, puis Paul, puis elle-même. Par la fenêtre, Paul la voit intercepter l'homme, qui lui tend un papier officiel et semble la prendre pour une folle. Elle hurle, donne des coups de pied dans sa voiture, et il repart.` },
        { n: `II·9`, t: `Le papier : Annie doit 506 dollars d'impôts en retard, et le fisc a pris une garantie sur sa maison. Elle détache Paul pour qu'il lui explique : elle ne pourra pas la vendre. Annie jure qu'elle paie toujours ses factures ; si elle a oublié cette fois, c'est à cause de lui. Paul lui dit qu'il lui doit la vie et lui offre les 400 dollars de son portefeuille ; flattée, elle proteste pour la forme. Il lui conseille de payer l'après-midi même, et compte profiter de son absence pour effacer les marques sur la porte.` },
        { n: `II·10`, t: `Annie lui apporte son portefeuille : elle veut qu'il lui donne l'argent lui-même. En se rappelant le jour où il l'a retiré, quand il était libre, Paul se met à pleurer. Il demande à être installé dans son fauteuil pour écrire pendant qu'elle sera en ville.` },
        { n: `II·11`, t: `Une fois Annie partie, Paul crochète la serrure avec une autre épingle volée : il a repris des forces en soulevant la machine à écrire en cachette. Il efface les marques sur le chambranle, se renferme dans sa chambre et, pensant à l'oiseau du zoo qui a dû finir par oublier son pays, se perd dans l'écriture.` },
        { n: `II·12`, t: `Pendant trois semaines, Paul vit dans un calme étrange et écrit une douzaine de pages par jour, trois fois plus que d'habitude ; le Novril est son seul vice. Ils ont pris leurs habitudes, comme regarder la télévision ensemble en fin d'après-midi. L'idée d'Annie sur les abeilles fait son chemin : Misery et Miss Evelyn-Hyde seraient deux sœurs perdues de vue, avec la même allergie. Paul appelle Annie pour noter son idée à la main. Puis la pluie arrive, et tout change.` },
        { n: `II·13`, t: `Début avril, quelques jours de beau temps : Annie installe Paul sur la véranda, ils regardent la télévision et elle chante. Paul rêve que sa voiture est retrouvée et termine les chapitres 9 et 10 de son roman. À la mi-avril, le ciel se couvre, et Annie aussi. Le premier jour de pluie, elle est en retard pour ses cachets, couverte de taches ; elle répond qu'elle ne va pas bien et se pince la lèvre jusqu'au sang. Paul l'entend se gifler dans le salon et prend peur.` },
        { n: `II·14`, t: `Comme Annie ne vient pas l'installer, Paul se hisse seul dans son fauteuil, et elle le surprend. Puisqu'il se débrouille si bien, il n'a qu'à remplir lui-même ses « n ». Plus tard, Paul se fait mal en se recouchant et pioche dans sa réserve de Novril.` },
        { n: `II·15`, t: `À son réveil, Annie est assise sur le lit, couverte de nourriture, un rat vivant pris dans un piège à la main. Le regard vide, elle explique que tout le monde est comme ce rat, puis l'écrase jusqu'à le tuer. Elle propose d'aller chercher son arme pour les tuer tous les deux ; Paul la supplie de le laisser finir Le Retour de Misery. Elle doit partir dans son « coin pour rire », dans les collines, où surtout elle crie. Elle lui laisse des cachets, mais rien à manger.` },
        { n: `II·16`, t: `Deux heures après son départ, Paul sort de sa chambre pour tenter de s'enfuir. Le salon est jonché d'assiettes sales ; sur la table, un gros album de souvenirs. La porte d'entrée a trois serrures solides, celle de la cuisine est fermée aussi ; dehors, la cour est inondée, et la remise où se trouve la hache est verrouillée. Dans le cellier, Paul trouve des allumettes et pense un instant mettre le feu à la maison, puis renonce. Une voix intérieure lui dit qu'il a abandonné pour de bon ; il répond à voix haute : « Afrique. »` },
        { n: `II·17`, t: `Paul pille le cellier : sardines, jambon en boîte, raisins secs, céréales, en se demandant ce qu'Annie risque de remarquer. Ses jambes commencent à lui faire mal ; il décide de regagner sa chambre en prenant soin de ne laisser aucune trace.` },
        { n: `II·18`, t: `Dans le salon, Paul ouvre l'album. Le mariage des parents d'Annie, la naissance de son frère, puis la sienne. Un incendie qui a tué cinq personnes, dont trois enfants des Krenmitz, des voisins qu'Annie gardait et détestait : elle avait onze ans. La mort de son père, tombé dans l'escalier ; celle d'Andrea Saint James, sa camarade de chambre à l'école d'infirmières, tombée elle aussi. Puis des avis de décès de patients, d'hôpital en hôpital, toujours plus à l'ouest. Un mariage avec Ralph Dugan, qui demande le divorce pour cruauté mentale. À Boulder, devenue infirmière en chef de la maternité, des nouveau-nés meurent : Annie est arrêtée, jugée à Denver, et acquittée faute de preuves. Une coupure parle aussi d'un jeune homme, Andrew Pomeroy, retrouvé mort, mutilé. La dernière annonce la disparition de Paul. Il comprend qu'il est dans le livre des morts d'Annie.` },
        { n: `II·19`, t: `Assommé par ses cachets, Paul comprend que personne ne viendra le sauver : il devra tuer Annie lui-même.` },
        { n: `II·20`, t: `Un orage, puis le gel. Dans la grange abandonnée, le cochon et les vaches d'Annie crient de faim. Paul avance son roman, le meilleur des Misery selon lui : la seconde moitié se passera en Afrique, chez les Bourkas, le peuple des abeilles, qui vénèrent une idole de pierre. Chaque soir, il cherche comment tuer Annie ; une des vaches se tait. Il prend un couteau de boucher à la cuisine et le cache sous son matelas. Mais Annie revient pendant son sommeil : il ne s'en rend compte qu'en sentant une aiguille s'enfoncer dans son bras.` },
        { n: `II·21`, t: `Paul se réveille calme, drogué, persuadé qu'Annie va le tuer. Elle s'assoit sur le lit, pose quelque chose de lourd hors de sa vue, et propose la bonne ou la mauvaise nouvelle. La bonne : la fonte des neiges a emporté la voiture de Paul, comme elle avait emporté ce sale Andrew Pomeroy. La mauvaise : elle sait qu'il est sorti et qu'il a lu son album, grâce à des cheveux posés entre les pages. Elle raconte : Pomeroy, un auto-stoppeur qui se prétendait dessinateur, était devenu son amant ; elle a compris qu'il mentait, il s'est moqué d'elle, et elle l'a retrouvé mort dans sa baignoire. Paul a eu son accident à l'endroit même où elle avait abandonné le corps : elle y a vu un signe. Elle a aussi trouvé le bout d'épingle cassé dans la serrure.` },
        { n: `II·22–23`, label: `Chapitres 22 et 23`, t: `Annie l'interroge : combien de fois est-il sorti ? Trois, avoue Paul, sans parler du couteau. Elle ne le croit pas et sort le couteau de sous le matelas. Elle annonce qu'elle va faire en sorte qu'il ne puisse plus jamais s'enfuir, comme on punissait les ouvriers voleurs des mines de diamants. Elle découvre ses jambes, prend une hache, un chalumeau et un flacon de Bétadine. Malgré ses supplications, elle lui tranche le pied gauche au-dessus de la cheville et cautérise la plaie au chalumeau. C'est sa faute, lui dit-elle. Paul perd connaissance.` }
      ]
    },
    {
      title: `Troisième partie`, name: `Paul`,
      items: [
        { n: `III·1`, t: `Un extrait du Retour de Misery : Ian et Geoffrey regardent des abeilles affluer dans une clairière africaine. Le texte s'interrompt net.` },
        { n: `III·2`, t: `Paul secoue la machine à écrire jusqu'à ce que le « t » tombe. Il voudrait exiger une nouvelle machine mais, avec un pied et un pouce en moins, il n'ose même plus demander. C'est le premier jour de l'été. Il se remet au travail.` },
        { n: `III·3`, t: `Le roman reprend : Misery est attachée nue dans la clairière, couverte d'abeilles. Ian veut s'élancer vers elle ; on le retient, et Hezekiah, leur compagnon africain, explique que tant que les tambours battent, les abeilles restent endormies.` },
        { n: `III·4`, t: `Le texte s'arrête au milieu d'une phrase : c'est le « e » qui a lâché, la lettre la plus courante. Annie tond la pelouse sur sa tondeuse autoportée. Paul devra écrire à la main ; il n'osera pas réclamer une autre machine, Annie est devenue trop étrange. Il revoit malgré lui la hache, et se dit qu'être écrivain, c'est se souvenir de l'histoire de chaque cicatrice. Il décide de revisiter ce souvenir, pour qu'il cesse de le hanter.` },
        { n: `III·5–6`, label: `Chapitres 5 et 6`, t: `Après l'amputation, la douleur a disparu un temps. Paul repasse ces journées : tout tourne autour d'un même mot, misère, qui désigne à la fois sa souffrance et le personnage qui l'a sauvé. Il a joué les Shéhérazade pour Annie, mais aussi pour lui-même : s'il n'est pas mort, c'est qu'il voulait savoir comment finirait l'histoire de Misery.` },
        { n: `III·7`, t: `Annie ne l'a pas laissé reprendre le travail tout de suite. Elle a lu tout ce qu'il avait écrit et s'est remise à remplir les « n », comme pour se faire pardonner. Mais le besoin de connaître la suite, chez lui comme chez elle, a été le plus fort : Paul voulait retourner à son roman.` },
        { n: `III·8`, t: `Paul s'est remis au travail, d'abord par courtes séances, puis de plus en plus longtemps, malgré la douleur de son moignon. Chaque soir, Annie lisait ses pages : elle aussi avait besoin de connaître la suite.` },
        { n: `III·9`, t: `Un jour, Annie lui avait apporté une coupe glacée en le priant de lui raconter la fin. Paul avait refusé : elle voulait tuer la poule aux œufs d'or. Elle s'était excusée. Quelques jours plus tard, il s'est plaint du bruit de la machine, et elle lui a coupé le pouce : en réalité, elle n'avait pas supporté son refus. Paul songe au pouvoir de la fiction, qui fait pleurer ou enrager pour des personnages inventés, comme cette lectrice qui avait aménagé chez elle un salon de Misery.` },
        { n: `III·10`, t: `Paul, endormi, revit la scène : Annie arrive avec un couteau électrique, menace de l'égorger s'il se débat et lui tranche le pouce en répétant qu'elle l'aime. Le soir, elle lui apporte un gâteau d'anniversaire hérissé de bougies… et de son pouce : s'il est sage, il n'aura pas à manger cette bougie-là. Paul se réveille en retenant un cri. Par la fenêtre, il voit une voiture de police dans l'allée.` },
        { n: `III·11`, t: `Depuis, Paul compte les jours. Il continue d'écrire malgré tout, même si l'inspiration faiblit, et Annie le félicite pour son travail pendant sa « convalescence ». Le livre est presque fini, et c'est le Misery le mieux construit qu'il ait écrit. Paul sait que sa vie s'arrêtera avec lui. Une seule chose est sûre : il ne criera pas.` },
        { n: `III·12`, t: `Retour au présent : un jeune policier descend de la voiture. Paul est déchiré entre l'envie d'appeler au secours et la peur d'être puni ; il mesure à quel point Annie a brisé sa volonté. Il finit par crier « Afrique ! » et par jeter un cendrier en céramique à travers la vitre.` },
        { n: `III·13`, t: `Le policier lève les yeux, sort une photo de sa poche et reconnaît Paul. Mais Annie arrive, armée de la croix de bois plantée sur la tombe de sa vache, Bessie : elle l'enfonce dans le dos du jeune homme et frappe encore et encore, jusqu'à ce que la croix se brise.` },
        { n: `III·14`, t: `Paul pense à se tuer avant qu'Annie ne se venge, quand il voit que le policier bouge encore : il rampe vers sa voiture. Paul crie pour l'avertir. Annie arrive sur sa tondeuse autoportée, roule sur l'arme et le bras du policier, puis fait demi-tour et lui passe sur la tête. Paul vomit.` },
        { n: `III·15`, t: `Annie enferme Paul, dégage la tondeuse, range le corps et la voiture dans la grange, puis nettoie la cour, très sereine. Elle rend à Paul son cendrier : c'est lui qui a tué ce policier, dit-elle. Paul lui répond que l'homme avait sa photo, donc que sa voiture a été retrouvée : ils se racontaient des histoires. En la regardant arroser la pelouse, il remarque qu'elle a oublié la lame ensanglantée de la tondeuse.` },
        { n: `III·16`, t: `Paul lui demande de le tuer vite. Annie sait qu'elle devrait, mais pas tout de suite. Elle le porte jusqu'à la cave humide, infestée de rats, le pose sur un matelas et s'approche avec une seringue.` },
        { n: `III·17`, t: `La morphine, c'est pour plus tard, si ses jambes lui font mal. Annie le gifle quand il lui rappelle qu'elle l'a amputé. Elle a l'arme du policier : si quelqu'un vient avant la nuit, elle le tuera, puis Paul, puis elle-même. Paul comprend que s'il lui arrive malheur, il mourra ici, dévoré par les rats.` },
        { n: `III·18`, t: `À la nuit, Annie compte conduire la voiture et le corps jusqu'à son coin pour rire, dans les collines. Elle a déjà son histoire : elle dira aux policiers qu'elle a parlé au jeune homme puis l'a laissé repartir ; et Paul Sheldon, son auteur préféré, elle s'en serait souvenue. Elle tendra une chaîne en travers de l'allée. Son sang-froid inquiète Paul. Ils ont peut-être une semaine avant que la police revienne avec un mandat : il devra écrire plus vite.` },
        { n: `III·19`, t: `Annie remet une vitre à la fenêtre de Paul. Sans le livre, lui dit-elle, elle le tuerait tout de suite ; elle s'étonne qu'il ne connaisse pas encore la fin : il hésite entre deux. Furieuse, elle lui demande s'il va encore tuer Misery. Paul rit : elle le tuera de toute façon. Il pense pourtant que la fin lui plaira.` },
        { n: `III·20`, t: `Paul demande un bloc-notes pour écrire pendant son absence ; Annie refuse, de peur qu'on voie la lumière. Il la supplie de ne pas le laisser dans le noir avec les rats. Elle rit, éteint et l'enferme.` },
        { n: `III·21`, t: `Seul dans le noir, Paul imagine le policier mort venant le punir et hurle au contact d'une araignée. Ses yeux s'habituent : il reconnaît le petit barbecue où il a brûlé Fast Cars. Il urine dans le bassin et sent qu'une infection urinaire commence.` },
        { n: `III·22`, t: `Paul s'injecte la morphine, en espérant qu'elle le tuera.` },
        { n: `III·23`, t: `Dans les brumes de la morphine, la douleur disparaît. Paul fixe le barbecue et sent naître une idée, mais il s'endort.` },
        { n: `III·24`, t: `À son réveil, l'idée revient : brûler quelque chose. Paul se demande si Annie avait raison sur Fast Cars ; peut-être n'a-t-il jamais détesté Misery, seulement qu'elle soit plus aimée que lui. Près du barbecue, il y a un bidon d'allume-feu. Il serait dévasté de brûler Le Retour de Misery… mais la vraie question, c'est le mal que cela ferait à Annie.` },
        { n: `III·25`, t: `Annie rentre en fin d'après-midi, épuisée. Paul refuse une nouvelle piqûre, pour qu'elle ne trouve pas le bidon caché dans son caleçon. Elle le remonte dans sa chambre, avec du papier et des crayons. Le livre sera fini dans moins de deux semaines, promet Paul, et il lui demande de ne plus le lire d'ici là : la fin, dit-il, sera brûlante.` },
        { n: `III·26–27`, label: `Chapitres 26 et 27`, t: `Tous deux se reposent : Annie dort le reste de la journée. Le soir, Paul cache le bidon d'allume-feu derrière une plinthe descellée, puis écrit pendant quatre heures.` },
        { n: `III·28`, t: `Chapitre 37 du Retour de Misery : Geoffrey attend devant la hutte du chef des Bourkas, éclairée de torches, décidé à tuer le chef quand Hezekiah le fera sortir. Le texte s'interrompt : une voiture approche.` },
        { n: `III·29`, t: `Annie se précipite : Paul s'est déjà éloigné de la fenêtre. Elle décide de lui faire confiance et referme la porte sans la verrouiller. Deux policiers descendent de voiture : un colosse que Paul surnomme Goliath, et un petit homme en civil, David. Paul calcule ses chances, puis choisit de se taire : il ne veut pas qu'Annie aille en prison, il veut s'occuper d'elle lui-même.` },
        { n: `III·30`, t: `Annie a suivi l'affaire à la radio : le policier disparu s'appelait Duane Kushner et recherchait Paul, mais personne n'a encore fait le lien entre les deux disparitions. Annie fait entrer David et Goliath et répond à leurs questions avec aplomb. Elle leur propose même de visiter la chambre d'amis ; ils déclinent, mais demandent à voir la grange. Qu'ils disent bonjour à Misery, son cochon, leur lance-t-elle.` },
        { n: `III·31`, t: `Les policiers repartent. Annie ne comprend pas pourquoi Paul n'a pas crié ; il assure qu'il veut finir son livre, et c'est vrai. Elle a vu les deux hommes échanger un regard inquiet : il faut se dépêcher.` },
        { n: `III·32`, t: `Paul écrit, poussant le roman vers son dénouement. Trois jours après la visite des policiers, des journalistes se présentent : Annie les chasse avec son fusil, puis s'écorche le front en disant à Paul que c'est ce qu'ils veulent voir.` },
        { n: `III·33`, t: `La police locale passe à son tour. À sa propre surprise, Paul a un peu pitié d'Annie, ainsi harcelée. La prochaine fois, prévient-elle, ils viendront avec un mandat.` },
        { n: `III·34`, t: `Paul écrit jusqu'à en avoir mal à la main. Annie remarque qu'il n'écrit plus seulement pour elle, et Paul sait qu'elle a raison.` },
        { n: `III·35`, t: `Des curieux viennent observer la maison ; Annie tend une chaîne en travers de l'allée. Paul annonce qu'il finira le livre le lendemain, ce qui la réjouit. Elle lui dit qu'elle l'aime et lui apporte de la glace pour sa main.` },
        { n: `III·36–37`, label: `Chapitres 36 et 37`, t: `Paul continue d'écrire. Le lendemain, Annie apporte cachets et soupe et, voyant l'état de sa main, regrette de ne pas lui avoir racheté une machine ; Paul tient à finir sur celle-ci. Elle lui a réservé une surprise : du caviar. Paul éclate de rire, et Annie rit avec lui.` },
        { n: `III·38`, t: `Paul mange presque tout le caviar, en se disant joyeusement qu'il tuera Annie le ventre plein. Elle a aussi acheté du champagne pour fêter la fin. Comme il fume toujours une cigarette après avoir fini un livre, il lui en demande une ; elle désapprouve, mais accepte.` },
        { n: `III·39`, t: `La fin du Retour de Misery : Geoffrey réfléchit à la différence entre les dieux cruels et les dieux fous, et comprend qu'il ne veut pas vivre si Misery meurt. Quand elle se réveille, il sait qu'il pourra vivre, même sans son amour.` },
        { n: `III·40`, t: `Paul remplit les lettres manquantes. Il se sent vide, comme chaque fois, mais c'est bon d'avoir fini. Annie lui a laissé une cigarette et une seule allumette. Paul roule jusqu'à la plinthe descellée pour se préparer.` },
        { n: `III·41`, t: `Paul appelle Annie, qui file chercher le champagne. Il allume calmement son allumette. Quand elle entre, il est assis derrière une pile de feuilles imbibées d'allume-feu, coiffée de la page de titre : Le Retour de Misery.` },
        { n: `III·42`, t: `Paul lui dit qu'elle avait raison : c'est le meilleur des Misery. Terrifiée, Annie lâche le champagne et le supplie. Il laisse tomber l'allumette. Annie hurle et se jette sur les feuilles en flammes pour les sauver ; Paul soulève la lourde machine à écrire et la lui abat sur le dos.` },
        { n: `III·43–44`, label: `Chapitres 43 et 44`, t: `Debout sur son pied valide, Paul se jette sur Annie, brûlée et blessée par les éclats de la bouteille, et lui enfonce des poignées de papier brûlant dans la bouche. Elle le repousse, se cogne la tête contre le manteau de la cheminée et s'effondre. Mais alors que Paul rampe vers la porte, elle rouvre les yeux, hurle à travers le papier, lui agrippe les jambes puis serre les mains autour de son cou. Paul lui crie de mourir : elle s'écroule sur lui.` },
        { n: `III·45`, t: `Paul se dégage, sans croire qu'elle soit morte, et l'enferme dans la chambre : ses doigts apparaissent dans la fente de la porte. Il s'enferme dans la salle de bain, avale trois cachets et perd connaissance.` },
        { n: `III·46`, t: `À son réveil, Paul est certain qu'Annie l'attend dehors avec la hache. Dans la vie, contrairement aux romans, les plans échouent : il voulait la tuer d'un seul coup à la tête. Il pense au vrai manuscrit, caché sous le lit (les feuilles brûlées n'étaient qu'un leurre), et rassemble son courage pour aller arrêter une voiture. Dans le salon, il voit Annie dans chaque ombre. Une voiture arrive : il jette le pingouin en céramique à travers la fenêtre et appelle au secours.` },
        { n: `III·47`, t: `Ce sont les deux policiers venus interroger Annie, David et Goliath, de leurs vrais noms Wicks et McKnight, horrifiés par la maigreur de Paul. Il leur parle d'une déesse et les prévient qu'elle est peut-être encore vivante. Ils vont voir la chambre.` },
        { n: `III·48`, t: `Wicks revient : soulagé, Paul croit qu'Annie est morte. Mais il n'y a personne dans la chambre. Paul hurle jusqu'à perdre connaissance.` }
      ]
    },
    {
      title: `Quatrième partie`, name: `La Déesse`,
      items: [
        { n: `IV·1–3`, label: `Chapitres 1 à 3`, t: `Les mêmes sons sans suite qu'au début, dans le brouillard. Neuf mois ont passé. Paul réapprend à marcher, boit trop et n'écrit plus. Le Retour de Misery va paraître, tiré à un million d'exemplaires, et son éditeur le presse d'écrire le récit de sa captivité. En rentrant chez lui, il voit Annie se jeter sur lui avec la hache… et le tuer.` },
        { n: `IV·4–8`, label: `Chapitres 4 à 8`, t: `Ce n'était que de l'imagination : Annie n'était pas une déesse immortelle. Après s'être échappée de la chambre, elle s'était traînée jusqu'à la grange, où elle est morte d'une fracture du crâne, une tronçonneuse à la main. Mais, comme Misery dans sa tombe, elle ne repose pas en paix dans l'esprit de Paul.` },
        { n: `IV·9–12`, label: `Chapitres 9 à 12`, t: `En rentrant, Paul a croisé un garçon qui poussait une mouffette dans un chariot de supermarché, et une idée d'histoire lui est venue. Chez lui, malgré les apparitions d'Annie, il se met à écrire. Il retrouve le trou dans le papier où l'histoire l'attend, et accélère, en pleurant.` }
      ]
    }
  ],
  links: [
    { t: `Annie vit près de Sidewinder, au Colorado : le même village que celui qui se trouve au pied de l'Overlook, l'hôtel de Shining.`, to: `shining` },
    { t: `Le roman fait allusion à ce qu'il reste de l'Overlook après les événements de Shining.`, gate: `shining` },
    { t: `Paul Sheldon est cité dans Rose Madder, et Annie Wilkes dans Sac d'os.` },
    { t: `Misery devait d'abord paraître sous le pseudonyme de Richard Bachman, comme Marche ou crève, mais le secret a été éventé pendant l'écriture.`, to: `marche-ou-creve` }
  ],
  conclusion: {
    analyse: `Huis clos à deux personnages, Misery est à la fois un thriller d'une rare cruauté et une réflexion de King sur son métier. Prisonnier, Paul retrouve le goût d'écrire grâce à la contrainte même qui le détruit. Annie incarne le lecteur possessif qui croit posséder l'auteur et ses personnages. Les chapitres du Retour de Misery, insérés dans le récit, rendent palpable le pouvoir de la fiction, capable de faire tenir un homme debout.`,
    emotions: `Claustrophobie, douleur presque physique, dégoût (la hache, le pouce, la tondeuse). On oscille entre terreur, pitié et une étrange fascination pour Annie. L'espoir renaît à chaque tentative de Paul, puis s'effondre. La fin libère sans guérir : on sort du livre épuisé.`,
    message: `Le livre parle de dépendance : au Novril, à l'alcool, et même aux lecteurs. Il interroge la relation entre un artiste et son public, et montre que l'écriture peut être à la fois une prison et une planche de salut. King y affronte aussi ses propres démons de l'époque, l'addiction et la pression des fans.`
  }
});

  parts: [
    {
      title: `Première partie`, name: `Préliminaires`,
      items: [
        { n: `1`, t: `Jack passe un entretien d'embauche avec Stuart Ullman, le gérant de l'Overlook, qu'il méprise d'emblée. Ullman ne l'engage que sur l'insistance d'Al Shockley. Il décrit l'hôtel, son isolement total l'hiver, et raconte le drame du précédent gardien, Grady : rendu fou par l'isolement, il a tué sa femme et ses deux filles avant de se suicider. Jack assure qu'il ne boit plus et qu'il compte profiter de l'hiver pour écrire sa pièce.` },
        { n: `2`, t: `À Boulder, dans un appartement miteux, Wendy attend le retour de Jack pendant que Danny guette la voiture, assis sur le trottoir. Elle repense à ce qui les a menés là : Jack a perdu son poste de professeur au lycée de Stovington, dans le Vermont, après avoir frappé un élève, George Hatfield, qui crevait ses pneus. Danny demande si son père a fait à George ce qu'il lui a fait à lui. Wendy finit par pleurer seule dans sa chambre.` },
        { n: `3`, t: `Watson, l'homme d'entretien, fait visiter le sous-sol à Jack. Il lui montre la vieille chaudière : la pression y monte sans cesse et doit être évacuée régulièrement, faute de quoi tout peut exploser. Bavard et grossier, il raconte aussi quelques anecdotes sur l'hôtel et les gens qui y sont morts, en se moquant de la peur qu'en a Ullman.` },
        { n: `4`, t: `Sur le trottoir, Danny capte les pensées de ses parents : la peur du « DIVORCE », et celle que Jack recommence la « Mauvaise Chose », boire. On apprend que Jack, ivre, lui a cassé le bras deux ans plus tôt. Tony apparaît et lui montre une vision : un grand bâtiment sous la neige, un miroir où brille le mot REDRUM, et une silhouette armée d'un maillet qui le poursuit dans un couloir en hurlant de venir « prendre sa médecine ». Quand Jack arrive, Danny croit voir un maillet ensanglanté sur le siège de la voiture. Ce n'est qu'un sac de courses.` },
        { n: `5`, t: `Jack appelle Al Shockley depuis une cabine pour le remercier, loin des oreilles de Wendy. Il se souvient de sa descente aux enfers : les nuits de beuverie avec Al, la nuit où leur voiture a percuté un vélo d'enfant sans qu'ils trouvent personne, et les heures passées un revolver à la main. Depuis, ils ont arrêté de boire tous les deux. Al lui laisse espérer que le lycée pourrait le reprendre au printemps. Dans la voiture, Danny voudrait raconter sa vision, mais son père est ailleurs.` },
        { n: `6`, t: `La nuit, Wendy ne parvient pas à dormir. Elle repense à leur mariage, aux années d'alcool de Jack, au soir où il a cassé le bras de Danny et où elle a envisagé le divorce, puis au matin où il a arrêté de boire. Elle s'inquiète des absences de Danny et de Tony, et pense à sa propre mère, avec qui elle est brouillée.` },
        { n: `7`, t: `Danny se réveille d'un cauchemar où la silhouette au maillet le traque. À la fenêtre, il appelle Tony, dont la voix lointaine lui souffle de ne pas y aller. En se rendormant, il revoit le mot REDRUM.` }
      ]

    {
      title: `Deuxième partie`, name: `Jour de fermeture`,
      items: [
        { n: `8`, t: `La famille monte vers l'hôtel dans la vieille Volkswagen, par une route de montagne vertigineuse. Wendy est impressionnée, Danny inquiet. En apercevant l'Overlook, l'enfant reconnaît le bâtiment de ses visions.` },
        { n: `9`, t: `C'est le dernier jour de la saison et le hall grouille de clients qui partent. Ullman accueille les Torrance. Danny découvre le terrain de roque, un jeu qui se joue avec des maillets, et les animaux taillés dans des haies près de l'aire de jeux. Il mesure combien ils vont être seuls tout l'hiver, et capte malgré lui les pensées crues d'une cliente.` },
        { n: `10`, t: `Dick Hallorann, le chef cuisinier, fait visiter les cuisines et les réserves, pleines pour l'hiver. Il appelle Danny « doc », un surnom que personne ne lui a dit, et Danny l'entend lui proposer de venir en Floride… dans sa tête. Au bar, Hallorann prévient Jack qu'il n'y reste plus une goutte d'alcool.` },
        { n: `11`, t: `Dans sa voiture, Hallorann explique à Danny qu'ils partagent un don, que sa grand-mère appelait le « shining ». Danny lui envoie un bonjour mental d'une force qui le sidère. Hallorann l'avertit : l'hôtel garde des traces du passé, et certaines personnes y voient des choses, comme une femme de chambre dans la chambre 217. Il lui fait promettre de ne jamais y entrer, et lui dit de l'appeler par la pensée en cas de besoin.` },
        { n: `12`, t: `Ullman fait visiter l'hôtel aux Torrance : les étages, l'ascenseur, la suite présidentielle où ont dormi des présidents. Là, Danny voit des éclaboussures de sang et de cervelle sur le mur, que personne d'autre ne remarque. Ils passent devant la chambre 217, puis découvrent leur appartement.` },
        { n: `13`, t: `Ullman et les derniers employés s'en vont. Debout sur le perron, Jack a l'étrange sensation de rapetisser pendant que l'hôtel, lui, grandit et devient menaçant. Il fait rentrer sa famille.` }

    {
      title: `Troisième partie`, name: `Le nid de guêpes`,
      items: [
        { n: `14`, t: `Le 20 octobre, Jack refait la toiture quand une guêpe le pique : il découvre un nid sous les bardeaux. Seul là-haut, il repense à son alcoolisme, puis à George Hatfield, l'élève bègue qu'il a exclu de l'équipe de débat et qui l'a accusé d'avoir avancé le chronomètre. Il l'a tabassé en le surprenant à crever ses pneus. Persuadé d'aller mieux, Jack redescend chercher un insecticide.` },
        { n: `15`, t: `Wendy et Danny rentrent de Sidewinder. Wendy se dit plus heureuse qu'elle ne l'a jamais été depuis son mariage. Jack offre à Danny le nid de guêpes, vidé à l'insecticide, comme son propre père l'avait fait pour lui. Wendy, qui déteste tout ce qui pique, n'est pas rassurée.` },
        { n: `16`, t: `Jack écrit de nouveau. Un soir, Danny s'enferme dans la salle de bain et tombe en transe ; Jack enfonce la porte. L'enfant murmure « roque », « redrum », et parle de bégaiement et de chronomètre, ce qui trouble profondément Jack, qui ne lui a jamais parlé de George. La nuit, des guêpes sortent du nid supposé vide : Danny est piqué onze fois. Jack jure les avoir toutes tuées, et commence à moins aimer l'hôtel.` },
        { n: `17`, t: `Les Torrance emmènent Danny chez le docteur Edmonds, à Sidewinder. Pendant l'examen, l'enfant tombe en transe : Tony lui montre l'hôtel la nuit, la silhouette au maillet et le mot REDRUM. Le médecin conclut que Tony est une invention de l'esprit d'un enfant intelligent, angoissé par les tensions de ses parents. Jack et Wendy repartent à moitié rassurés.` },
        { n: `18`, t: `Au sous-sol, Jack découvre un vieil album de coupures de presse sur l'Overlook : ventes successives, propriétaires douteux comme le millionnaire Horace Derwent, liens avec la mafia, fêtes fastueuses, une invitation à un bal masqué, et le meurtre d'un truand dans la suite présidentielle en 1966. Fasciné, il y voit le sujet d'un livre.` },
        { n: `19`, t: `Danny, la clé passe-partout en poche, s'arrête devant la chambre 217 malgré sa promesse à Hallorann. Il renonce, mais doit repasser devant une vieille lance à incendie enroulée au mur. L'embout tombe sur le tapis ; terrifié, Danny croit sentir le tuyau ramper derrière lui comme un serpent et s'enfuit jusqu'à l'escalier.` },
        { n: `20`, t: `Par curiosité et par rancune, Jack téléphone à Ullman pour l'interroger sur le passé trouble de l'hôtel. Ullman se fâche. Peu après, Al Shockley rappelle Jack, furieux, et lui interdit d'écrire sur l'Overlook. Humilié, Jack cède en apparence, mais la colère couve.` },
        { n: `21`, t: `Cette nuit-là, chacun veille de son côté. Jack regrette son appel et en veut à Al. Wendy envisage de partir avec Danny chez sa mère pour l'hiver. Danny perçoit l'inquiétude de ses parents et redoute le retour de la « Mauvaise Chose ».` },
        { n: `22`, t: `En descendant à Sidewinder, Wendy propose à Danny de passer l'hiver ailleurs, chez sa mère. Danny explique que son père se sent bien à l'hôtel et a peur de ne pas retrouver de travail. Il ne veut pas aller chez sa grand-mère et supplie de rester avec Jack. Wendy accepte. Quand elle lui demande si Jack a recommencé à boire, il répond non… en pensant « pas encore ».` },
        { n: `23`, t: `Jack taille les animaux de buis avant la neige. En traversant l'aire de jeux, il entend un bruit : le chien semble accroupi, prêt à bondir, le lapin est à quatre pattes, les lions se sont rapprochés du chemin. Quand il rouvre les yeux, tout est redevenu normal. Il met ça sur le compte de la fatigue et décide de ne rien dire à Wendy.` },
        { n: `24`, t: `La neige se met à tomber et ne s'arrête plus ; la route disparaît. Sur le perron, chacun ressent un soulagement secret : la décision de rester ne leur appartient plus. Ils rentrent, comme avalés par l'hôtel.` },
        { n: `25`, t: `Danny finit par céder et ouvre la chambre 217 avec la clé passe-partout. Dans la salle de bain, derrière le rideau de douche, gît une femme morte depuis longtemps, gonflée et livide. Elle se redresse et tend les mains vers lui. Danny s'enfuit, mais n'arrive pas à rouvrir la porte…` }
      ]
    },
    {
      title: `Quatrième partie`, name: `Bloqués par la neige`,
      items: [
        { n: `26`, t: `Au même moment, Wendy s'endort et Jack somnole au sous-sol, plongé dans les archives. Il a décidé d'écrire son livre sur l'hôtel malgré Al. Il rêve de son père, infirmier alcoolique qui battait sa mère à coups de canne en lui ordonnant de « prendre sa médecine ». Somnambule, il entend la voix de son père sortir de la radio et lui dire de tuer sa femme et son fils. Il fracasse l'appareil. Wendy le trouve devant la radio détruite : leur dernier moyen d'appeler à l'aide est la motoneige.` },
        { n: `27`, t: `Wendy découvre Danny en haut de l'escalier, figé, suçant son pouce, le cou couvert d'ecchymoses. Persuadée que Jack l'a étranglé, elle s'enferme avec l'enfant et menace de le tuer s'il le touche encore. Puis elle se décide à affronter Jack, qu'elle entend chanter quelque part dans l'hôtel.` },
        { n: `28`, t: `Blessé d'être accusé, Jack s'est réfugié au bar désert du Colorado Lounge. Il s'imagine commander à boire à un barman qu'il baptise Lloyd. Wendy le rejoint avec Danny. L'enfant sort de sa torpeur et crie que c'était « elle », la femme de la chambre 217.` },
        { n: `29`, t: `Dans la cuisine, Jack fait boire à Danny un thé additionné de sherry. L'enfant raconte enfin tout : le shining, Hallorann, le sang dans la suite présidentielle, et la femme de la baignoire qui l'a saisi à la gorge. Wendy reproche à Jack ses vieux réflexes de buveur et son projet de livre. Jack décide d'aller voir la chambre 217.` },
        { n: `30`, t: `Jack monte à la 217. La salle de bain semble vide, mais il croit percevoir une présence derrière le rideau de douche, et des bruits le suivent. Il refuse d'y croire et ressort précipitamment ; derrière lui, la poignée de la porte bouge. En redescendant, il décide de mentir.` },
        { n: `31`, t: `Jack annonce à Wendy et Danny qu'il n'y a rien dans la chambre 217. Il sourit pour les rassurer… et n'a jamais eu autant besoin d'un verre.` },
        { n: `32`, t: `Wendy veut faire descendre Danny au plus vite ; Jack lui oppose la neige et l'argent. Elle se souvient de la motoneige, et Jack promet d'aller la vérifier. Plus tard, il cherche des explications rationnelles aux bleus de Danny, rumine son humiliation et se surprend à imaginer étrangler Wendy. Il fait ensuite un cauchemar où il frappe George Hatfield avec un maillet de roque, avant de comprendre que c'est Danny qu'il frappe, pendant que l'hôtel rit.` },
        { n: `33`, t: `Au matin, dans la remise, Jack prépare la motoneige, cette « guêpe mécanique » qu'il déteste. Il comprend que l'hôtel agit aussi sur lui, et que c'est Danny qu'il veut vraiment. Persuadé que partir serait une erreur, il arrache la magnéto et la jette dans la neige, puis va faire une bataille de boules de neige avec son fils.` },
        { n: `34`, t: `Quelques jours après Thanksgiving, les bleus de Danny s'estompent. L'enfant joue dans l'aire de jeux enneigée et se sent piégé dans un tunnel de béton. En sortant, il voit les animaux de buis bouger : les lions avancent, le chien tourne la tête. Il fuit en raquettes vers l'hôtel, tombe sur le perron avec une douleur au mollet et se jette dans les bras de son père.` },
        { n: `35`, t: `Dans le hall, Danny raconte que les animaux de buis l'ont poursuivi. Jack, qui les voit immobiles sous la neige, refuse d'y croire, mais la jambe de l'enfant dit autre chose. La tension monte entre Wendy et lui.` },
        { n: `36`, t: `En pleine nuit, l'ascenseur se met en marche tout seul. Les Torrance le trouvent jonché de confettis, de serpentins et d'un masque de soirée. Jack s'entête à parler de court-circuit et de vieux restes de fête ; Wendy comprend qu'il a pris le parti de l'hôtel.` },
        { n: `37`, t: `Danny s'aventure dans la salle de bal et contemple la vieille pendule sous sa cloche de verre. Tony lui apparaît une dernière fois, lointain et affaibli, et lui fait comprendre ce qui l'attend s'il reste. L'enfant comprend qu'il doit appeler à l'aide.` }
      ]
    },
    {
      title: `Cinquième partie`, name: `Questions de vie et de mort`,
      items: [
        { n: `38`, t: `En Floride, Hallorann est frappé par un appel mental d'une violence inouïe : Danny le supplie de venir. Sans hésiter, il laisse tout tomber et cherche à rejoindre le Colorado au plus vite.` },
        { n: `39`, t: `Wendy trouve Danny assis dans l'escalier, la lèvre en sang : il a appelé Tony et est tombé d'une chaise. Tony ne peut plus venir, l'hôtel l'en empêche. Danny explique qu'il est la clé qui a remonté l'hôtel, que Jack a saboté la motoneige et qu'il va essayer de leur faire du mal. Il a appelé Hallorann, sans savoir s'il a été entendu. Wendy s'arme du plus grand couteau de la cuisine. Autour de Danny, l'hôtel murmure.` },
        { n: `40`, t: `Au sous-sol, Jack s'enfonce dans les archives de l'hôtel et en oublie la chaudière, dont la pression grimpe dangereusement ; il la purge in extremis. Il sent que l'Overlook le veut, lui, et le manque d'alcool devient insupportable.` },
        { n: `41`, t: `Danny se réveille d'un rêve où l'hôtel brûle et où son père en sort en flammes. Il cherche Jack par la pensée et se fait chasser par une voix monstrueuse. Dans le couloir, un homme déguisé en chien, le visage en sang, lui barre le passage. Danny tente d'appeler Hallorann, mais l'hôtel l'en empêche.` },
        { n: `42`, t: `Après une nuit passée à chercher un vol, Hallorann embarque pour Denver. Il a prévenu les gardes forestiers, qui ne l'ont pas pris au sérieux. Au décollage, un nouvel appel de Danny le frappe, puis se coupe net.` },
        { n: `43`, t: `Jack entre au Colorado Lounge : le bar est soudain plein de bouteilles, et Lloyd, le barman, le sert. Ici, la maison offre. Après plus d'un an d'abstinence, Jack boit. Autour de lui, la salle se remplit de convives masqués, venus d'une fête d'un autre temps.` },
        { n: `44`, t: `Ivre, Jack déambule dans la fête. Un serveur renverse un verre sur lui et l'entraîne aux toilettes : c'est Grady, l'ancien gardien. Il explique à Jack qu'il doit « corriger » sa femme et son fils comme lui l'a fait, et que Danny essaie de faire venir quelqu'un de l'extérieur. Jack croise aussi l'homme déguisé en chien. Puis la fête s'évanouit, et il s'effondre.` },
        { n: `45`, t: `Hallorann atterrit à Denver en pleine tempête. Il loue une voiture et prend la route des montagnes, sans plus rien capter de Danny.` },
        { n: `46`, t: `À midi, Wendy descend préparer à manger. Au bar, qui empeste le gin, elle trouve Jack ivre mort. Il l'agrippe et l'étrangle en l'accusant de comploter contre lui. Elle l'assomme avec une bouteille. Avec l'aide de Danny, elle le traîne jusqu'au garde-manger et l'y enferme, pendant qu'il hurle des menaces.` },
        { n: `47`, t: `Au milieu de l'après-midi, Danny entend encore les cris de Jack. Wendy met un disque pour couvrir le bruit, le serre contre elle et lui promet que quelqu'un viendra, et qu'au printemps ils iront pêcher tous les trois.` },
        { n: `48`, t: `Enfermé dans le garde-manger, Jack enrage. La voix de Grady lui parle à travers la porte et doute de sa détermination. Jack promet de livrer Danny à l'hôtel et de s'occuper de sa femme. Le verrou s'ouvre.` },
        { n: `49`, t: `Hallorann sort de la route en croisant un chasse-neige. Le conducteur, Howard Cottrell, le tire de là, lui prête ses gants et l'envoie chez un garagiste de Sidewinder qui pourra lui louer une motoneige ; lui aussi « sent » les choses. Arrivé à Sidewinder, Hallorann reçoit des images d'avertissement terrifiantes, dont le bruit sourd d'un maillet.` },
        { n: `50`, t: `Danny comprend enfin : REDRUM, lu dans un miroir, veut dire MURDER, « meurtre ». Jack, libéré et armé d'un maillet de roque, part à leur recherche. Wendy est attaquée et grièvement blessée, mais se défend avec son couteau. Danny s'enfuit dans les étages.` },
        { n: `51`, t: `Hallorann atteint l'Overlook en motoneige. En passant près des animaux de buis, il est attaqué par eux et doit se battre pour atteindre l'hôtel.` },
        { n: `52`, t: `Grièvement blessée, Wendy s'est enfermée dans la salle de bain. Jack défonce la porte à coups de maillet ; elle lui entaille la main avec une lame de rasoir. Le bruit de la motoneige d'Hallorann détourne Jack, qui descend à sa rencontre.` },
        { n: `53`, t: `Hallorann entre dans l'hôtel. Jack surgit et le frappe au maillet, lui brisant la mâchoire. Le laissant pour mort, il part à la recherche de Danny.` },
        { n: `54`, t: `Caché au troisième étage, Danny voit enfin Tony de près : c'est lui-même, plus âgé. Daniel Anthony Torrance. Tony lui dit qu'il doit se souvenir de ce que son père a oublié.` },
        { n: `55`, t: `Jack trouve Danny. L'enfant lui tient tête : ce n'est pas son papa, c'est l'hôtel. Un instant, le vrai Jack refait surface et lui dit de fuir, puis la chose qui l'habite se défigure à coups de maillet. Danny se souvient alors : la chaudière n'a pas été purgée. La créature se précipite au sous-sol.` },
        { n: `56`, t: `Danny rejoint Wendy et Hallorann, blessés : la chaudière va sauter, il faut fuir. Ils sortent dans la neige. Au sous-sol, la chose qui était Jack tente de purger la chaudière et croit avoir gagné. L'Overlook explose et s'embrase.` },
        { n: `57`, t: `Les animaux de buis, calcinés, ne bougent plus. Dans la remise, Hallorann sent l'hôtel lui ordonner de tuer la mère et l'enfant ; il jette le maillet et repart. Sur la motoneige, ils fuient pendant que le toit s'effondre. Plus bas, des secours viennent à leur rencontre.` },
        { n: `58`, label: `Épilogue`, t: `L'été suivant, dans un hôtel du Maine où Hallorann est désormais chef, Wendy, encore dans un corset, se remet lentement. Elle va accepter un emploi proposé par Al Shockley. Hallorann promet à Danny qu'il sera toujours là pour lui. Au bout du ponton, l'enfant attrape un poisson, et ils rient ensemble au soleil.` }
      ]
    }
  ],
  links: [
    { t: `Dick Hallorann apparaît dans Ça, bien avant l'Overlook : on le croise jeune, cuisinier dans l'armée, à Derry en 1930.` },
    { t: `Sidewinder, le village au pied de l'Overlook, est aussi celui près duquel vit Annie Wilkes dans Misery.`, to: `misery` },
    { t: `Dans Le Fléau, Mère Abigaël raconte que sa grand-mère appelait le don de prophétie « the shine », le même mot que pour Danny.` },
    { t: `Docteur Sleep (2013) est la suite directe de Shining : on y retrouve Danny devenu adulte.`, gate: `shining` }
  ],
  conclusion: {
    analyse: `Sous ses dehors de maison hantée, Shining est le portrait d'un homme qui se défait. L'Overlook n'invente rien : il exploite des failles déjà là, l'alcool, la colère héritée d'un père violent, la rancœur sociale, l'orgueil blessé. King alterne les points de vue de Jack, Wendy et Danny, et c'est ce qui rend le livre si poignant : on voit Jack lutter, perdre, et on comprend chaque étape de sa chute. La neige transforme l'hôtel en huis clos où la pression monte, au propre comme au figuré, avec cette chaudière qu'il faut purger chaque jour.`,
    emotions: `Une angoisse lente, d'abord diffuse (les guêpes, la lance à incendie, les haies), puis oppressante. Beaucoup de tendresse pour Danny, si seul avec ce qu'il sait. Une vraie tristesse face à un père qui aime son fils et ne parvient pas à se sauver. Le final mêle terreur et soulagement, et l'épilogue apporte un apaisement fragile.`,
    message: `L'alcoolisme et la violence familiale se transmettent comme une malédiction : Jack reproduit son père, et l'hôtel ne fait qu'amplifier ce qui était déjà en lui. Le livre parle aussi de responsabilité : Jack se voit victime des circonstances, mais ses choix comptent. Enfin, Danny et Hallorann portent l'espoir du roman : on peut vivre avec un don, ou une blessure, sans en devenir prisonnier, à condition de ne pas rester seul.`
  }
});

  cover: { bg: `#2b2119`, fg: `#eadfcb`, motif: `markers` },
  art: `illustrations/simetierre.webp`,
  note: `Découpage de l'édition originale : 62 chapitres en 3 parties, plus un épilogue. Certains chapitres sont regroupés dans une même fiche.`,
  pitch: `Louis Creed, médecin, s'installe avec sa femme Rachel, leur fille Ellie et leur bébé Gage à Ludlow, dans le Maine, dans une belle maison au bord d'une route où les camions passent à toute vitesse. Leur vieux voisin, Jud Crandall, leur fait découvrir un sentier qui mène à un cimetière d'animaux entretenu par les enfants du coin. Plus loin dans les bois, il existe un autre lieu, beaucoup plus ancien.`,
  cast: [
    [`Louis Creed`, `Médecin au service de santé de l'université du Maine.`],

  ],
  parts: [
    {
      title: `Première partie`, name: `Le Simetierre`,
      items: [
        { n: `1`, t: `Après un long voyage depuis Chicago, les Creed arrivent devant leur nouvelle maison de Ludlow. Louis, à bout de patience, a même rêvé de tout plaquer pour devenir médecin à Disney World. Mais la joie de sa famille devant la maison efface tout, et Gage prononce son premier vrai mot : « maison ».` },
        { n: `2`, t: `Pendant que Louis cherche ses clés, Ellie tombe de la balançoire et s'écorche le genou, et Gage se fait piquer par une abeille. Le vieux voisin d'en face, Jud Crandall, traverse la route pour les aider. Un camion passe en trombe : Jud les prévient que cette route est dangereuse.` },
        { n: `3–5`, label: `Chapitres 3 à 5`, t: `L'installation : les déménageurs, les cartons, la première soirée dans la maison. Les Creed font la connaissance de Norma, la femme de Jud, et Jud invite Louis à venir boire une bière. Ellie remarque un sentier bien entretenu qui part du champ derrière la maison et s'enfonce dans les bois.` },
        { n: `6`, t: `Le soir, sur la véranda de Jud, Louis se sent immédiatement chez lui. Un énorme camion passe. Jud lui explique que le sentier mène à un cimetière d'animaux : la route « use beaucoup d'animaux ». Il conseille de faire castrer le chat d'Ellie, Church, pour qu'il traîne moins près de la route.` },
        { n: `7–10`, label: `Chapitres 7 à 10`, t: `Jud emmène la famille jusqu'au cimetière des animaux, au bout du sentier : un cercle de tombes d'enfants sous un panneau maladroit, « SIMETIERRE », adossé à un énorme mur de branchages qu'il déconseille d'escalader. Ellie est bouleversée à l'idée que Church puisse mourir. De retour à la maison, Rachel refuse violemment d'aborder la mort avec sa fille, et le couple se dispute ; Louis devine un traumatisme lié à Zelda, la sœur de Rachel. Il se résout à faire opérer Church et se laisse un mot pour appeler le vétérinaire.` },
        { n: `11`, t: `Au petit déjeuner, Ellie demande ce que signifie le mot sur le tableau ; Louis lui explique que Church n'aura plus envie de traverser la route. Le soulagement de sa fille le touche. Réconcilié avec Rachel, il part pour son premier jour de travail, sans oser lui reparler de Zelda.` },
        { n: `12–15`, label: `Chapitres 12 à 15`, t: `Premier jour à l'infirmerie de l'université. On amène Victor Pascow, un étudiant renversé par une voiture, le crâne fracassé. Avant de mourir, il appelle Louis par son nom, alors qu'il ne le connaît pas, et lui parle du cimetière des animaux. Louis est profondément secoué ; il rentre chez lui et tente de reprendre le cours de sa vie.` },
        { n: `16`, t: `En pleine nuit, Pascow apparaît dans la chambre, le crâne ensanglanté, et ordonne à Louis de le suivre. Louis se croit en train de rêver. Pascow le conduit à travers les bois jusqu'au cimetière des animaux et l'avertit de ne jamais franchir le mur de branchages, quoi qu'il arrive.` },
        { n: `17–20`, label: `Chapitres 17 à 20`, t: `Au réveil, les pieds et les draps de Louis sont couverts de terre et d'aiguilles de pin ; il se persuade qu'il a été somnambule. L'automne passe. Le soir d'Halloween, Norma Crandall fait une crise cardiaque, et Louis lui porte secours à temps. Rachel est fière de son mari.` },
        { n: `21`, t: `Grâce à Louis, Norma s'en tire bien. Thanksgiving approche : Rachel et les enfants partent à Chicago chez les Goldman, mais Louis reste. Ses beaux-parents le méprisent depuis toujours ; Rachel ignore qu'autrefois son père a voulu payer Louis pour qu'il renonce à l'épouser.` },
        { n: `22`, t: `Le jour de Thanksgiving, Church est retrouvé mort, tué sur la route, devant chez Jud. Ellie l'adore. Plutôt que de l'enterrer au cimetière des animaux, Jud emmène Louis de l'autre côté du mur de branchages, pour une longue marche nocturne à travers les bois et un marécage, jusqu'à un ancien cimetière micmac au sommet d'une colline. Louis creuse le sol rocailleux et enterre le chat lui-même.` },
        { n: `23–26`, label: `Chapitres 23 à 26`, t: `Le lendemain, Church revient. Vivant, mais changé : il sent la terre, se déplace maladroitement, et tue de petits animaux qu'il laisse déchiquetés. Jud finit par raconter : il a lui-même enterré son chien là-haut quand il était enfant, d'autres l'ont fait avec leurs bêtes, et un taureau nommé Hanratty en est revenu méchant. Selon de vieux récits, les Micmacs auraient abandonné ce lieu, jugé souillé par un Wendigo.` },
        { n: `27–30`, label: `Chapitres 27 à 30`, t: `La famille rentre de Chicago. Ellie trouve que Church sent mauvais et n'aime plus le prendre dans ses bras. Louis garde le secret. L'hiver s'installe, Noël passe, et Church dépose régulièrement des proies déchiquetées. Louis se demande ce qu'il a fait, et pourquoi Jud l'a emmené là-bas.` },
        { n: `31`, t: `Le soir du Nouvel An, les Crandall rendent visite aux Creed : c'est la dernière fois que Norma viendra. Peu après, Rachel appelle Louis en larmes : Norma est morte d'une attaque.` },
        { n: `32`, t: `Louis passe la soirée avec Jud, qui s'enivre en évoquant Norma. Ellie pose des questions sur la mort, et Louis lui répond avec franchise. En l'entendant, Rachel trouve enfin la force de raconter l'agonie de sa sœur Zelda, morte d'une méningite quand Rachel était enfant et seule à la veiller.` },
        { n: `33–35`, label: `Chapitres 33 à 35`, t: `Louis porte le cercueil de Norma. Sur le chemin du retour, Ellie pleure et demande pourquoi les gens meurent. Rachel raconte que Church a rapporté un rat mort et a grogné contre elle. L'hiver passe : Ellie fête ses six ans, Gage a sa première coupe de cheveux, puis le printemps arrive. Un jour où il reste seul avec son fils, Louis fait voler un cerf-volant avec lui dans un champ voisin et lui dit qu'il l'aime. Le soir, il surprend Church caché dans le placard de Gage, le chasse, puis regarde longuement son fils dormir.` }
      ]
    },
    {
      title: `Deuxième partie`, name: `Le cimetière micmac`,
      items: [
        { n: `36`, t: `Gage a été tué par un camion sur la route. Louis rejoue sans cesse les dernières secondes, en imaginant qu'il rattrape son fils à temps. Lors de la veillée funèbre, son beau-père, ivre, l'accuse d'être responsable de sa mort : les deux hommes se battent, le cercueil tombe, et Rachel s'enfuit en hurlant. Son ami Steve Masterton veille sur elle et sur Ellie.` },
        { n: `37`, t: `De retour à la maison, Louis donne un calmant à Rachel. Ellie, mutique, ne lâche plus une photo d'elle et de Gage ; elle compte prier pour que Dieu lui rende son frère, comme Lazare. Seul avec Church, Louis boit et pense pour la première fois au cimetière micmac. Tard dans la nuit, on frappe à la porte : c'est Jud.` },
        { n: `38–39`, label: `Chapitres 38 et 39`, t: `Après minuit, Jud raconte à Louis l'histoire de Timmy Baterman, mort en Italie pendant la guerre, que son père, Bill, a enterré dans le cimetière micmac. Timmy est revenu, mais ce n'était plus lui : une chose froide et cruelle, qui connaissait les secrets de chacun. Bill a fini par l'abattre, a mis le feu à la maison et s'est tué. Jud avoue que ce lieu, plus ancien que les Micmacs, a une emprise sur lui, et il craint qu'il ait voulu atteindre Louis à travers la mort de Gage. Louis promet que son fils restera où il est.` },

    { id: "docteur-sleep", title: "Docteur Sleep", original: "Doctor Sleep", year: 2013, cover: { bg: "#151b2b", fg: "#e6e2f0", motif: "moon" }, from: "shining", gate: "shining",

      pitch: "Danny Torrance a grandi. Adulte, il se bat contre les mêmes démons que son père, et son don le met sur la route d'une fillette au « shining » plus puissant encore que le sien." },
    { id: "ca", title: "Ça", original: "It", year: 1986, cover: { bg: "#1f262b", fg: "#ece6d8", motif: "balloon" }, from: "shining",
      why: "On y croise Dick Hallorann, des années avant l'Overlook.",

    { id: "charlie", title: "Charlie", original: "Firestarter", year: 1980, cover: { bg: "#2a1710", fg: "#f0dcc8", motif: "flame" }, from: "carrie",

      pitch: "Un matin d'automne, un dôme invisible et infranchissable s'abat sur la petite ville de Chester's Mill, dans le Maine. Coupés du monde, les habitants voient vite le pouvoir changer de mains." },

    { id: "salem", title: "Salem", original: "'Salem's Lot", year: 1975, cover: { bg: "#221d1a", fg: "#ebe2d2", motif: "house" }, from: "simetierre",
